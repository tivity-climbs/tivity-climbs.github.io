<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Orbit Courier</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#05070f;overflow:hidden;
    font-family:"Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-user-select:none;user-select:none;}
  #stage{position:fixed;inset:0;touch-action:none;cursor:crosshair;}
  canvas{display:block;width:100%;height:100%;}
  /* ---------- HUD ---------- */
  #hud{position:fixed;top:10px;left:12px;right:12px;display:flex;align-items:flex-start;
    justify-content:space-between;pointer-events:none;color:#cfe3ff;z-index:5;
    text-shadow:0 1px 4px rgba(0,0,0,.8);letter-spacing:.04em;}
  .hudcol{display:flex;flex-direction:column;gap:6px;}
  .hudrow{display:flex;gap:14px;align-items:baseline;font-size:14px;font-weight:600;}
  .hudlabel{font-size:10px;opacity:.65;letter-spacing:.18em;}
  #fuelwrap{width:170px;height:12px;border:1px solid rgba(160,200,255,.45);border-radius:7px;
    background:rgba(10,16,32,.6);overflow:hidden;}
  #fuelbar{height:100%;width:100%;border-radius:6px;
    background:linear-gradient(90deg,#2dd4bf,#67e8f9);transition:width .12s linear;}
  #fuelbar.low{background:linear-gradient(90deg,#f97316,#fbbf24);}
  #fuelbar.crit{background:linear-gradient(90deg,#ef4444,#f87171);animation:blink .5s steps(2) infinite;}
  @keyframes blink{50%{opacity:.4}}
  #score{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:20px;color:#ffe9a8;}
  #deliv{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:20px;color:#a5f3fc;}
  #topright{display:flex;gap:8px;pointer-events:auto;align-items:center;}
  .btn{pointer-events:auto;background:rgba(20,30,55,.8);color:#cfe3ff;border:1px solid rgba(140,180,255,.4);
    border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:.1em;cursor:pointer;}
  .btn:hover{background:rgba(40,60,100,.9);border-color:#7dd3fc;}
  #warn{position:fixed;top:44px;left:50%;transform:translateX(-50%);color:#fca5a5;font-size:12px;
    font-weight:700;letter-spacing:.2em;z-index:5;opacity:0;transition:opacity .3s;pointer-events:none;
    text-shadow:0 0 8px rgba(239,68,68,.7);}
  #hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:rgba(190,215,255,.75);
    font-size:12px;letter-spacing:.06em;z-index:5;pointer-events:none;text-align:center;
    transition:opacity 1.2s;text-shadow:0 1px 4px rgba(0,0,0,.9);}
  /* ---------- Overlays ---------- */
  #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
    background:radial-gradient(ellipse at center,rgba(8,12,26,.55) 0%,rgba(4,6,14,.88) 100%);}
  #overlay.hidden{display:none;}
  .panel{max-width:520px;width:min(88vw,520px);text-align:center;color:#e2eeff;
    background:rgba(12,18,38,.82);border:1px solid rgba(125,211,252,.35);border-radius:18px;
    padding:28px 30px;box-shadow:0 10px 60px rgba(0,0,0,.6),0 0 40px rgba(56,189,248,.08) inset;}
  .panel h1{margin:0 0 4px;font-size:34px;letter-spacing:.14em;font-weight:800;
    background:linear-gradient(90deg,#67e8f9,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .panel h2{margin:0 0 8px;font-size:26px;letter-spacing:.1em;}
  .panel .sub{font-size:13px;color:#9db4d8;margin-bottom:16px;letter-spacing:.08em;}
  .obj{display:inline-block;background:rgba(45,212,191,.1);border:1px solid rgba(45,212,191,.35);
    color:#99f6e4;border-radius:10px;padding:8px 14px;font-size:13px;margin-bottom:16px;line-height:1.5;}
  .keys{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#bcd3f5;margin-bottom:20px;}
  .keys b{color:#ffe9a8;font-weight:700;}
  kbd{background:#1c2947;border:1px solid #3b5480;border-bottom-width:3px;border-radius:5px;
    padding:1px 7px;font-family:ui-monospace,monospace;font-size:12px;color:#dbeafe;}
  .bigbtn{font-size:16px;padding:12px 34px;letter-spacing:.16em;border-radius:12px;}
  #finalscore{font-family:ui-monospace,monospace;font-size:22px;color:#ffe9a8;margin:6px 0 18px;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" aria-label="Orbit Courier game canvas"></canvas>
</div>

<div id="hud">
  <div class="hudcol">
    <div class="hudlabel">FUEL</div>
    <div id="fuelwrap"><div id="fuelbar" role="meter" aria-label="fuel"></div></div>
    <div class="hudrow">
      <span><span class="hudlabel">SCORE </span><span id="score">0</span></span>
      <span><span class="hudlabel">DELIVERIES </span><span id="deliv">0/5</span></span>
    </div>
  </div>
  <div id="topright">
    <button class="btn" id="mutebtn" aria-label="toggle sound">SOUND: ON</button>
    <button class="btn" id="restartbtn" aria-label="restart game">RESTART (R)</button>
  </div>
</div>
<div id="warn">⚠ OUT OF FUEL — DRIFT OR GRAB A POD</div>
<div id="hint">Deliver <b>5 packages</b> — thrust with <b>WASD / arrows</b> or <b>hold mouse / touch</b> · aim for the glowing ring · <b>R</b> restart · don’t touch anything</div>

<div id="overlay">
  <div class="panel" id="panel">
    <div id="ovcontent"></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   ORBIT COURIER — pilot with gravity, deliver between moons.
   Original single-file game. No libraries, no external assets.
   ============================================================ */
const W = 960, H = 600;             // logical world size
const STEP = 1 / 120;               // fixed physics timestep
const THRUST = 235;                 // px/s^2
const FUEL_RATE = 15;               // fuel per second of thrust
const FUEL_MAX = 100;
const SHIP_R = 6;
const N_DELIVERIES = 5;             // packages to win (shown in HUD)
const KILL_MARGIN = 160;            // drift beyond this = lost in space

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
let dpr = 1, scale = 1, ox = 0, oy = 0;

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width  = Math.round(innerWidth  * dpr);
  cv.height = Math.round(innerHeight * dpr);
  scale = Math.min(cv.width / W, cv.height / H);
  ox = (cv.width  - W * scale) / 2;
  oy = (cv.height - H * scale) / 2;
}
addEventListener("resize", resize); resize();

/* ---------------- bodies ---------------- */
const planets = [
  { x:255, y:318, r:44, mass:265000, hue:196, name:"Kepler-9"  },
  { x:705, y:288, r:33, mass:185000, hue:24,  name:"Vesta-4"  },
];
const moons = [
  { pl:0, orbitR:100, om: 0.47, r:13, mass:12000, a:0.9,          hue:150 },
  { pl:0, orbitR:158, om:-0.29, r:11, mass:10000, a:2.6,          hue:45  },
  { pl:1, orbitR:80,  om: 0.61, r:12, mass:11000, a:4.0,          hue:280 },
  { pl:1, orbitR:132, om:-0.40, r:10, mass:9000,  a:5.5,          hue:200 },
];
function moonPos(m){
  const p = planets[m.pl];
  return { x: p.x + Math.cos(m.a) * m.orbitR, y: p.y + Math.sin(m.a) * m.orbitR };
}
for (const m of moons){ const q = moonPos(m); m.x = q.x; m.y = q.y; } // positions valid before first tick
const gravBodies = () => {
  const g = [];
  for (const p of planets) g.push({ x:p.x, y:p.y, r:p.r, mass:p.mass });
  for (const m of moons) { const q = moonPos(m); g.push({ x:q.x, y:q.y, r:m.r, mass:m.mass }); }
  return g;
};
function accelAt(x, y, bodies){
  let ax = 0, ay = 0;
  for (const b of bodies){
    const dx = b.x - x, dy = b.y - y;
    const d2 = dx*dx + dy*dy + 500;              // softening
    const d  = Math.sqrt(d2);
    const a  = b.mass / d2;
    ax += a * dx / d; ay += a * dy / d;
  }
  return { ax, ay };
}
function hitsBody(x, y, bodies, pad){
  for (const b of bodies){
    const dx = x - b.x, dy = y - b.y;
    if (dx*dx + dy*dy < (b.r + pad) * (b.r + pad)) return b;
  }
  return null;
}

/* ---------------- stars ---------------- */
const stars = [];
for (let i = 0; i < 140; i++){
  stars.push({ x: Math.random()*W, y: Math.random()*H,
    s: Math.random()*1.6 + .3, tw: Math.random()*6.28, sp: .5 + Math.random()*2 });
}
function starfield(now){
  for (const s of stars){
    const a = .25 + .5 * (0.5 + 0.5 * Math.sin(now * s.sp + s.tw));
    ctx.fillStyle = `rgba(190,210,255,${a.toFixed(2)})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 6.283); ctx.fill();
  }
}

/* ---------------- game state ---------------- */
let state, ship, fuel, score, deliveries, pkg, cans, particles, floaters,
    shipAngle, thrusting, timeSincePickup, hintTimer, shake, camT, deathReason = "";
let t = 0;

function safeSpot(){
  // random point not inside any body
  for (let i = 0; i < 60; i++){
    const x = 60 + Math.random()*(W-120), y = 60 + Math.random()*(H-120);
    if (!hitsBody(x, y, gravBodies(), 70)) return { x, y };
  }
  return { x: W/2, y: 60 };
}
function reset(){
  state = "play";
  ship = { x: 480, y: 70, vx: -20, vy: 60 };
  fuel = FUEL_MAX; score = 0; deliveries = 0;
  shipAngle = Math.PI/2; thrusting = false;
  timeSincePickup = 0; hintTimer = 9; shake = 0;
  particles = []; floaters = [];
  cans = [];
  for (let i = 0; i < 2; i++) cans.push(spawnCan());
  pkg = newPackage(null);
  updateHUD();
}
function spawnCan(){
  const s = safeSpot();
  const ang = Math.random()*6.283;
  return { x:s.x, y:s.y, vx:Math.cos(ang)*14, vy:Math.sin(ang)*14, alive:true, respawn:0 };
}
function newPackage(fromIdx){
  let idx;
  do { idx = Math.floor(Math.random()*moons.length); } while (idx === fromIdx);
  return { mode:"pickup", moon:idx };
}

/* ---------------- input ---------------- */
const keys = {};
const ptr = { down:false, x:0, y:0 };
addEventListener("keydown", e => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === "r") restart();
  audioInit();
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

function toWorld(cx, cy){
  const r = cv.getBoundingClientRect();
  const px = (cx - r.left) * dpr, py = (cy - r.top) * dpr;
  return { x:(px - ox)/scale, y:(py - oy)/scale };
}
const stage = document.getElementById("stage");
stage.addEventListener("pointerdown", e => {
  audioInit();
  ptr.down = true; const w = toWorld(e.clientX, e.clientY); ptr.x = w.x; ptr.y = w.y;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (!ptr.down) return; const w = toWorld(e.clientX, e.clientY); ptr.x = w.x; ptr.y = w.y;
});
const endPtr = () => { ptr.down = false; };
stage.addEventListener("pointerup", endPtr);
stage.addEventListener("pointercancel", endPtr);

function getThrustDir(){
  let dx = 0, dy = 0;
  if (keys["arrowleft"]  || keys["a"]) dx -= 1;
  if (keys["arrowright"] || keys["d"]) dx += 1;
  if (keys["arrowup"]    || keys["w"]) dy -= 1;
  if (keys["arrowdown"]  || keys["s"]) dy += 1;
  if (dx || dy){
    const l = Math.hypot(dx, dy); return { x:dx/l, y:dy/l };
  }
  if (ptr.down){
    dx = ptr.x - ship.x; dy = ptr.y - ship.y;
    if (Math.hypot(dx, dy) > 12){ const l = Math.hypot(dx, dy); return { x:dx/l, y:dy/l }; }
  }
  return null;
}

/* ---------------- audio (all code-generated) ---------------- */
let AC = null, master = null, thrustGain = null, muted = false;
function audioInit(){
  if (AC){ if (AC.state === "suspended") AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 1; master.connect(AC.destination);
    const len = AC.sampleRate;
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random()*2 - 1;
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const filt = AC.createBiquadFilter(); filt.type = "lowpass"; filt.frequency.value = 320;
    thrustGain = AC.createGain(); thrustGain.gain.value = 0;
    src.connect(filt); filt.connect(thrustGain); thrustGain.connect(master);
    src.start();
  } catch(e){ AC = null; }
}
function setThrustSound(on){
  if (!AC || !thrustGain) return;
  const t = AC.currentTime;
  thrustGain.gain.cancelScheduledValues(t);
  thrustGain.gain.linearRampToValueAtTime(on ? .12 : 0, t + .07);
}
function beep(freq, dur, type, vol, delay){
  if (!AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || .15, t0 + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + .05);
}
function sfxPickup(){ beep(660,.12,"triangle",.16); beep(990,.14,"triangle",.12,.08); }
function sfxDeliver(){ beep(523,.1,"square",.08); beep(659,.1,"square",.08,.09); beep(784,.22,"square",.1,.18); }
function sfxCan(){ beep(880,.08,"triangle",.14); beep(1320,.1,"triangle",.1,.06); }
function sfxCrash(){
  if (!AC) return;
  beep(220,.5,"sawtooth",.2); beep(110,.7,"sine",.22,.05);
  const t0 = AC.currentTime, len = .4*AC.sampleRate;
  const buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const s = AC.createBufferSource(); s.buffer = buf;
  const g = AC.createGain(); g.gain.setValueAtTime(.3, t0);
  g.gain.exponentialRampToValueAtTime(.001, t0 + .4);
  s.connect(g); g.connect(master); s.start(t0);
}

/* ---------------- particles / floaters ---------------- */
function puff(x, y, n, hue, spd, life){
  for (let i = 0; i < n; i++){
    const a = Math.random()*6.283, v = spd*(.3+Math.random()*.9);
    particles.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v,
      r:1+Math.random()*2.6, life:life*(.5+Math.random()*.8), age:0, hue });
  }
}
function floatText(x, y, txt, col){ floaters.push({ x, y, txt, col, age:0, life:1.4 }); }

/* ---------------- simulation ---------------- */
function step(dt){
  t += dt;
  for (const m of moons){
    m.a += m.om * dt;
    const p = planets[m.pl];
    m.x = p.x + Math.cos(m.a)*m.orbitR; m.y = p.y + Math.sin(m.a)*m.orbitR;
  }
  for (const c of cans){
    if (!c.alive){
      c.respawn -= dt;
      if (c.respawn <= 0){ const s = safeSpot(); c.x=s.x; c.y=s.y; c.alive=true; }
      continue;
    }
    c.x += c.vx*dt; c.y += c.vy*dt;
    if (c.x < 30 || c.x > W-30) c.vx *= -1;
    if (c.y < 30 || c.y > H-30) c.vy *= -1;
    c.x = Math.max(30, Math.min(W-30, c.x));
    c.y = Math.max(30, Math.min(H-30, c.y));
  }
  for (const p of particles){ p.age += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= .985; p.vy *= .985; }
  particles = particles.filter(p => p.age < p.life);
  for (const f of floaters){ f.age += dt; f.y -= 22*dt; }
  floaters = floaters.filter(f => f.age < f.life);
  shake = Math.max(0, shake - dt*3);
  if (hintTimer > 0) hintTimer -= dt;

  if (state !== "play") { setThrustSound(false); return; }

  const bodies0 = gravBodies();
  const dir = getThrustDir();
  thrusting = !!(dir && fuel > 0);
  setThrustSound(thrusting);
  if (thrusting){
    ship.vx += dir.x * THRUST * dt; ship.vy += dir.y * THRUST * dt;
    fuel = Math.max(0, fuel - FUEL_RATE * dt);
    shipAngle = Math.atan2(dir.y, dir.x);
    // exhaust
    const bx = ship.x - dir.x*8, by = ship.y - dir.y*8;
    for (let i = 0; i < 2; i++){
      particles.push({ x:bx, y:by,
        vx:-dir.x*90 + (Math.random()-.5)*40 + ship.vx*.3,
        vy:-dir.y*90 + (Math.random()-.5)*40 + ship.vy*.3,
        r:1+Math.random()*2, life:.3+Math.random()*.25, age:0, hue:35 });
    }
  } else if (dir === null){
    const sp = Math.hypot(ship.vx, ship.vy);
    if (sp > 4) shipAngle = Math.atan2(ship.vy, ship.vx);
  }

  const bodies = bodies0;
  const g = accelAt(ship.x, ship.y, bodies);
  ship.vx += g.ax*dt; ship.vy += g.ay*dt;
  ship.x += ship.vx*dt; ship.y += ship.vy*dt;

  // crash?
  const hit = hitsBody(ship.x, ship.y, bodies, 4);
  if (hit){ die("You crashed into a celestial body."); return; }
  // lost in space?
  if (ship.x < -KILL_MARGIN || ship.x > W+KILL_MARGIN ||
      ship.y < -KILL_MARGIN || ship.y > H+KILL_MARGIN){
    die("Your ship drifted out of the system."); return;
  }

  // fuel pods
  for (const c of cans){
    if (c.alive && Math.hypot(c.x-ship.x, c.y-ship.y) < 18){
      c.alive = false; c.respawn = 12;
      fuel = Math.min(FUEL_MAX, fuel + 30);
      score += 10;
      floatText(c.x, c.y - 14, "+30 FUEL", "#fde68a");
      puff(c.x, c.y, 12, 50, 70, .5);
      sfxCan(); updateHUD();
    }
  }

  // package pickup / delivery
  const zoneMoon = moons[pkg.mode === "pickup" ? pkg.moon : pkg.dest];
  timeSincePickup += dt;
  if (Math.hypot(zoneMoon.x-ship.x, zoneMoon.y-ship.y) < zoneMoon.r + 38){
    if (pkg.mode === "pickup"){
      pkg.mode = "deliver";
      let idx; do { idx = Math.floor(Math.random()*moons.length); } while (idx === pkg.moon);
      pkg.dest = idx;
      timeSincePickup = 0;
      floatText(zoneMoon.x, zoneMoon.y - zoneMoon.r - 16, "PACKAGE UP!", "#86efac");
      puff(zoneMoon.x, zoneMoon.y, 14, 150, 80, .5);
      sfxPickup();
    } else {
      deliveries++;
      const fast = timeSincePickup < 9 ? 50 : 0;
      const pts = 100 + fast + Math.floor(fuel/5);
      score += pts;
      fuel = Math.min(FUEL_MAX, fuel + 40);
      floatText(zoneMoon.x, zoneMoon.y - zoneMoon.r - 16, "+" + pts, "#fde68a");
      puff(zoneMoon.x, zoneMoon.y, 22, 55, 110, .7);
      sfxDeliver();
      const from = pkg.dest;
      pkg = newPackage(from);
      timeSincePickup = 0;
      updateHUD();
      if (deliveries >= N_DELIVERIES){ win(); return; }
    }
  }
  updateHUD();
}

function die(reason){
  state = "dead";
  deathReason = reason;
  setThrustSound(false);
  shake = 1;
  puff(ship.x, ship.y, 46, 25, 190, 1.1);
  puff(ship.x, ship.y, 26, 200, 90, 1.4);
  sfxCrash();
  showOverlay(`
    <h2 style="color:#fca5a5">SHIP LOST</h2>
    <div class="sub">${reason}</div>
    <div id="finalscore">SCORE ${score} &nbsp;·&nbsp; DELIVERIES ${deliveries}/${N_DELIVERIES}</div>
    <button class="btn bigbtn" id="ovbtn" aria-label="retry">RETRY&nbsp;(R)</button>`);
}
function win(){
  state = "win";
  setThrustSound(false);
  puff(ship.x, ship.y, 40, 150, 130, 1.2);
  [523,659,784,1047].forEach((f,i)=>beep(f,.25,"triangle",.14,i*.13));
  showOverlay(`
    <h1 style="font-size:26px">ALL PACKAGES DELIVERED</h1>
    <div class="sub">The moons of Kepler-9 &amp; Vesta-4 thank you, courier.</div>
    <div id="finalscore">FINAL SCORE ${score} &nbsp;·&nbsp; ${deliveries}/${N_DELIVERIES}</div>
    <button class="btn bigbtn" id="ovbtn" aria-label="play again">PLAY AGAIN&nbsp;(R)</button>`);
}
function showOverlay(html){
  const ov = document.getElementById("overlay");
  document.getElementById("ovcontent").innerHTML = html;
  ov.classList.remove("hidden");
  const b = document.getElementById("ovbtn");
  if (b) b.addEventListener("click", restart);
}
function hideOverlay(){ document.getElementById("overlay").classList.add("hidden"); }
function restart(){ reset(); hideOverlay(); }
document.getElementById("restartbtn").addEventListener("click", restart);
document.getElementById("mutebtn").addEventListener("click", function(){
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : 1;
  this.textContent = muted ? "SOUND: OFF" : "SOUND: ON";
});

/* ---------------- HUD ---------------- */
const fuelbar = document.getElementById("fuelbar");
const scoreEl = document.getElementById("score");
const delivEl = document.getElementById("deliv");
const warnEl = document.getElementById("warn");
const hintEl = document.getElementById("hint");
let lastFuel = -1, lastScore = -1, lastDeliv = -1;
function updateHUD(){
  if (fuel !== lastFuel){
    lastFuel = fuel;
    fuelbar.style.width = (fuel/FUEL_MAX*100).toFixed(1) + "%";
    fuelbar.className = fuel < 20 ? "crit" : fuel < 45 ? "low" : "";
    warnEl.style.opacity = fuel <= 0 ? 1 : 0;
  }
  if (score !== lastScore){ lastScore = score; scoreEl.textContent = score; }
  if (deliveries !== lastDeliv){
    lastDeliv = deliveries;
    delivEl.textContent = deliveries + "/" + N_DELIVERIES;
  }
  hintEl.style.opacity = hintTimer > 0 ? 1 : 0.45;
}

/* ---------------- trajectory prediction ---------------- */
function predictPath(){
  const dir = getThrustDir();
  let px = ship.x, py = ship.y, vx = ship.vx, vy = ship.vy;
  const bodies = gravBodies();
  const pts = []; let crashed = false;
  const dt = 1/30;
  for (let i = 0; i < 110; i++){
    const g = accelAt(px, py, bodies);
    vx += g.ax*dt; vy += g.ay*dt;
    if (dir && fuel > 0 && i < 40){ vx += dir.x*THRUST*dt; vy += dir.y*THRUST*dt; }
    px += vx*dt; py += vy*dt;
    if (i % 4 === 0) pts.push({ x:px, y:py, a:1 - i/110 });
    if (hitsBody(px, py, bodies, 4)){ crashed = true; pts.push({ x:px, y:py, a:.9, hit:true }); break; }
    if (px < -KILL_MARGIN || px > W+KILL_MARGIN || py < -KILL_MARGIN || py > H+KILL_MARGIN) break;
  }
  return pts;
}

/* ---------------- rendering ---------------- */
function drawPlanet(p, now){
  const g = ctx.createRadialGradient(p.x - p.r*.35, p.y - p.r*.35, p.r*.15, p.x, p.y, p.r);
  g.addColorStop(0, `hsl(${p.hue},70%,62%)`);
  g.addColorStop(.55, `hsl(${p.hue},62%,40%)`);
  g.addColorStop(1, `hsl(${p.hue},65%,16%)`);
  // atmosphere glow
  const gg = ctx.createRadialGradient(p.x, p.y, p.r*.8, p.x, p.y, p.r*1.7);
  gg.addColorStop(0, `hsla(${p.hue},80%,60%,.22)`);
  gg.addColorStop(1, "hsla(0,0%,0%,0)");
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r*1.7, 0, 6.283); ctx.fill();
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  // bands
  ctx.save();
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.clip();
  ctx.fillStyle = "rgba(0,0,0,.18)";
  for (let i = -1; i < 3; i++){
    const yy = p.y - p.r + (i + .5) * p.r * .55 + Math.sin(now*.3 + i)*2;
    ctx.fillRect(p.x - p.r, yy, p.r*2, p.r*.16);
  }
  ctx.restore();
  // name
  ctx.fillStyle = "rgba(160,190,230,.4)";
  ctx.font = "600 9px ui-monospace,monospace"; ctx.textAlign = "center";
  ctx.fillText(p.name, p.x, p.y + p.r + 14);
}
function drawMoon(m, now){
  const p = planets[m.pl];
  ctx.strokeStyle = "rgba(140,170,220,.13)";
  ctx.setLineDash([3,7]);
  ctx.beginPath(); ctx.arc(p.x, p.y, m.orbitR, 0, 6.283); ctx.stroke();
  ctx.setLineDash([]);
  const g = ctx.createRadialGradient(m.x - m.r*.4, m.y - m.r*.4, m.r*.2, m.x, m.y, m.r);
  g.addColorStop(0, `hsl(${m.hue},45%,72%)`);
  g.addColorStop(1, `hsl(${m.hue},35%,30%)`);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, 6.283); ctx.fill();
  // craters
  ctx.fillStyle = "rgba(0,0,0,.22)";
  ctx.beginPath(); ctx.arc(m.x + m.r*.3, m.y - m.r*.2, m.r*.28, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(m.x - m.r*.25, m.y + m.r*.35, m.r*.2, 0, 6.283); ctx.fill();
}
function drawTargetRing(now){
  const m = moons[pkg.mode === "pickup" ? pkg.moon : pkg.dest];
  const pulse = 1 + .1*Math.sin(now*5);
  const R = (m.r + 38) * pulse;
  ctx.strokeStyle = pkg.mode === "pickup" ? "rgba(134,239,172,.85)" : "rgba(253,224,71,.9)";
  ctx.lineWidth = 1.6;
  ctx.setLineDash([6,6]); ctx.lineDashOffset = -now*30;
  ctx.beginPath(); ctx.arc(m.x, m.y, R, 0, 6.283); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = "700 9px ui-monospace,monospace"; ctx.textAlign = "center";
  ctx.fillStyle = pkg.mode === "pickup" ? "rgba(134,239,172,.9)" : "rgba(253,224,71,.95)";
  ctx.fillText(pkg.mode === "pickup" ? "▸ PICK UP" : "▸ DELIVER", m.x, m.y - R - 7);
}
function drawPackageIcon(x, y, s, bob){
  const yy = y + Math.sin(bob)*2.5;
  ctx.save(); ctx.translate(x, yy); ctx.rotate(.12);
  ctx.fillStyle = "#d9a066"; ctx.strokeStyle = "#7c4a1e"; ctx.lineWidth = 1.2;
  ctx.fillRect(-s, -s*.8, s*2, s*1.6); ctx.strokeRect(-s, -s*.8, s*2, s*1.6);
  ctx.strokeStyle = "#f3d9b0";
  ctx.beginPath(); ctx.moveTo(-s, -s*.8); ctx.lineTo(s, s*.8);
  ctx.moveTo(s, -s*.8); ctx.lineTo(-s, s*.8); ctx.stroke();
  ctx.restore();
}
function drawShip(now){
  ctx.save();
  ctx.translate(ship.x, ship.y); ctx.rotate(shipAngle);
  // hull
  ctx.fillStyle = "#e8f6ff"; ctx.strokeStyle = "#67e8f9"; ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(10, 0); ctx.lineTo(-7, -6.5); ctx.lineTo(-4, 0); ctx.lineTo(-7, 6.5);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // cockpit
  ctx.fillStyle = "#0ea5e9";
  ctx.beginPath(); ctx.arc(2.5, 0, 2.1, 0, 6.283); ctx.fill();
  if (thrusting){
    const f = 6 + Math.random()*7;
    const fg = ctx.createLinearGradient(8, 0, 8 + f, 0);
    fg.addColorStop(0, "rgba(255,220,120,.95)"); fg.addColorStop(1, "rgba(255,90,40,0)");
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.moveTo(-5,-3.4); ctx.lineTo(-5-f,0); ctx.lineTo(-5,3.4);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function draw(){
  const now = performance.now()/1000;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle = "#05070f";
  ctx.fillRect(0, 0, cv.width, cv.height);
  const sh = shake > 0 ? shake*6 : 0;
  const jx = sh ? (Math.random()-.5)*sh : 0, jy = sh ? (Math.random()-.5)*sh : 0;
  ctx.setTransform(scale, 0, 0, scale, ox + jx*scale, oy + jy*scale);

  // playfield frame
  ctx.strokeStyle = "rgba(90,120,180,.12)"; ctx.lineWidth = 1;
  ctx.strokeRect(.5, .5, W-1, H-1);

  starfield(now);
  for (const p of planets) drawPlanet(p, now);
  for (const m of moons) drawMoon(m, now);
  drawTargetRing(now);

  // fuel pods
  for (const c of cans){
    if (!c.alive) continue;
    ctx.save(); ctx.translate(c.x, c.y + Math.sin(now*3 + c.x)*2);
    ctx.strokeStyle = "#fbbf24"; ctx.fillStyle = "rgba(251,191,36,.16)"; ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let i = 0; i < 6; i++){
      const a = i*6.283/6 - Math.PI/2;
      const px = Math.cos(a)*9, py = Math.sin(a)*9;
      i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fde68a"; ctx.font = "700 8px ui-monospace,monospace"; ctx.textAlign = "center";
    ctx.fillText("F", 0, 3);
    ctx.restore();
  }

  // package waiting on the target moon
  {
    const m = moons[pkg.moon];
    if (pkg.mode === "pickup") drawPackageIcon(m.x, m.y - m.r - 14, 6, now*3);
  }

  // particles
  for (const p of particles){
    const a = Math.max(0, 1 - p.age/p.life);
    ctx.fillStyle = `hsla(${p.hue},90%,65%,${a.toFixed(2)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(0.4+a*.8), 0, 6.283); ctx.fill();
  }

  // trajectory prediction (only while playing)
  if (state === "play"){
    const pts = predictPath();
    for (const q of pts){
      if (q.hit){
        ctx.strokeStyle = "rgba(248,113,113,.95)"; ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(q.x-5, q.y-5); ctx.lineTo(q.x+5, q.y+5);
        ctx.moveTo(q.x+5, q.y-5); ctx.lineTo(q.x-5, q.y+5);
        ctx.stroke();
      } else {
        ctx.fillStyle = `rgba(125,211,252,${(q.a*.45).toFixed(2)})`;
        ctx.beginPath(); ctx.arc(q.x, q.y, 1.3, 0, 6.283); ctx.fill();
      }
    }
    // boundary drift warning
    const nearEdge = ship.x < 80 || ship.x > W-80 || ship.y < 80 || ship.y > H-80;
    if (nearEdge){
      const blink = .5 + .5*Math.sin(now*8);
      ctx.fillStyle = `rgba(248,113,113,${(.35+.55*blink).toFixed(2)})`;
      ctx.font = "700 13px ui-monospace,monospace"; ctx.textAlign = "center";
      ctx.fillText("⚠ TURN BACK — EDGE OF THE SYSTEM", W/2, 26);
      // arrow pointing back to center
      const ang = Math.atan2(H/2 - ship.y, W/2 - ship.x);
      ctx.save(); ctx.translate(ship.x, ship.y); ctx.rotate(ang);
      ctx.strokeStyle = `rgba(248,113,113,${(.4+.5*blink).toFixed(2)})`; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(26,0); ctx.lineTo(46,0);
      ctx.moveTo(40,-6); ctx.lineTo(46,0); ctx.lineTo(40,6); ctx.stroke();
      ctx.restore();
    }
  }

  if (state !== "dead"){
    drawShip(now);
    if (pkg.mode === "deliver") drawPackageIcon(ship.x - 14, ship.y, 5, now*3);
  } else {
    // wreck flicker
    ctx.fillStyle = `rgba(255,120,40,${.4+.3*Math.sin(now*20)})`;
    ctx.beginPath(); ctx.arc(ship.x, ship.y, 7, 0, 6.283); ctx.fill();
  }

  // floating texts
  ctx.font = "700 12px ui-monospace,monospace"; ctx.textAlign = "center";
  for (const f of floaters){
    const a = Math.max(0, 1 - f.age/f.life);
    ctx.fillStyle = f.col.replace(")", "," + a.toFixed(2) + ")").replace("#", "");
    ctx.fillStyle = `rgba(255,255,255,${a.toFixed(2)})`;
    ctx.fillText(f.txt, f.x, f.y);
  }
}

/* ---------------- main loop ---------------- */
let last = performance.now(), acc = 0;
function tick(nowMs){
  let dt = (nowMs - last)/1000; last = nowMs;
  if (dt > .1) dt = .1;
  if (dt < 0) dt = 0;
  acc += dt;
  let iter = 0;
  while (acc >= STEP && iter < 8){ step(STEP); acc -= STEP; iter++; }
  if (iter === 8) acc = 0; // drop backlog, never spiral
  draw();
}
function frame(nowMs){
  try { tick(nowMs); }
  catch(err){ console.error("LOOP ERR", err && err.stack || err); }
  requestAnimationFrame(frame);
}
// fallback pump in case rAF is starved (harmless if it isn't: dt-based)
let _pumpErrs = 0;
setInterval(() => { try { tick(performance.now()); } catch(e){ if (_pumpErrs++ < 3) console.error("PUMP ERR", e && e.stack || e); } }, 33);
reset();
showOverlay(`
  <h1>ORBIT COURIER</h1>
  <div class="sub">A gravity-is-your-engine delivery run</div>
  <div class="obj">Deliver <b>${N_DELIVERIES} packages</b> between the moons.<br>
  Fly into the green ring to <b>pick up</b>, then the yellow ring to <b>deliver</b>.
  Touching any surface <b>crashes</b> — gravity and skill keep you alive.</div>
  <div class="keys">
    <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> — thrust</div>
    <div><b>Hold mouse / touch</b> — thrust toward pointer</div>
    <div><kbd>R</kbd> — restart &nbsp;·&nbsp; fuel pods <b style="color:#fbbf24">⬡</b> refill +30</div>
  </div>
  <button class="btn bigbtn" id="ovbtn" aria-label="start game">LAUNCH&nbsp;🚀</button>`);
{
  const b = document.getElementById("ovbtn");
  b.addEventListener("click", () => { audioInit(); restart(); });
}
state = "ready";   // physics idle behind the title screen until launch
requestAnimationFrame(frame);

/* ---------------- test hook (harmless debug API) ---------------- */
window.__oc = {
  get state(){ return state; },
  get ship(){ return ship; }, get fuel(){ return fuel; },
  get score(){ return score; }, get deliveries(){ return deliveries; },
  get pkg(){ return pkg; }, moons, planets, N_DELIVERIES,
  setShip(x, y, vx, vy){ ship.x = x; ship.y = y; ship.vx = vx; ship.vy = vy; },
  get deathReason(){ return deathReason; },
  setFuel(f){ fuel = f; },
  moonIdx(i){ const m = moons[i]; return { x:m.x, y:m.y }; },
};
</script>
</body>
