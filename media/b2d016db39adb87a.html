<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Water Balloons — grab, throw, pop</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #aee1ff;
    font-family: "Avenir Next", "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
  }
  #c { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  #c.grabbing { cursor: grabbing; }
  .card {
    position: fixed; z-index: 10;
    background: rgba(255,255,255,.82);
    backdrop-filter: blur(6px);
    border-radius: 16px;
    box-shadow: 0 6px 24px rgba(31,58,95,.18), 0 1px 0 rgba(255,255,255,.7) inset;
    color: #1f3a5f;
  }
  #brand { top: 16px; left: 16px; padding: 10px 16px 12px; pointer-events: none; }
  #brand h1 { margin: 0; font-size: 19px; letter-spacing: .3px; font-weight: 800; }
  #brand p { margin: 3px 0 0; font-size: 12px; opacity: .75; line-height: 1.45; }
  #brand .score { display:inline-block; margin-top: 6px; font-size: 12px; font-weight: 700;
    background: #ffe3ec; color: #c2255c; padding: 2px 10px; border-radius: 999px; }
  #controls { top: 16px; right: 16px; display: flex; gap: 8px; padding: 8px; }
  #controls button {
    font: inherit; font-weight: 700; font-size: 13px; color: #1f3a5f;
    background: #fff; border: 1px solid rgba(31,58,95,.18); border-radius: 10px;
    padding: 8px 14px; cursor: pointer;
    box-shadow: 0 2px 6px rgba(31,58,95,.12);
    transition: transform .08s ease, background .15s ease;
  }
  #controls button:hover { background: #f2f8ff; }
  #controls button:active { transform: scale(.95); }
  @media (max-width: 560px) {
    #brand p { display: none; }
    #brand h1 { font-size: 15px; }
  }
</style>
</head>
<body>
<canvas id="c" aria-label="Water balloon playground. Drag balloons to throw them."></canvas>

<div id="brand" class="card">
  <h1>💧 water balloons</h1>
  <p>grab one &amp; flick to throw · hard drops pop them ·<br>press <b>R</b> to reset, <b>M</b> to mute</p>
  <span class="score" id="score">popped 0</span>
</div>

<div id="controls" class="card">
  <button id="mute" aria-label="Toggle sound">🔊</button>
  <button id="reset" aria-label="Reset balloons">Reset</button>
</div>

<script>
(() => {
'use strict';

/* ============================== setup ============================== */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
let W = 0, H = 0, floorY = 0, DPR = 1;
let clouds = [];

let lastLayoutW = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  floorY = H - 64;
  makeClouds();
  if (Math.abs(W - lastLayoutW) > Math.max(80, lastLayoutW * 0.2)) {
    lastLayoutW = W;
    reset(); // re-layout for a substantially different viewport
  } else {
    for (const b of balloons) clampBalloon(b);
  }
}
function makeClouds() {
  const rnd = mulberry32(7);
  clouds = [];
  const n = Math.max(2, Math.round(W / 420));
  for (let i = 0; i < n; i++) {
    clouds.push({ x: rnd() * W, y: 40 + rnd() * (H * 0.16), s: 0.6 + rnd() * 0.9 });
  }
}

/* ============================== helpers ============================== */
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hexRGB(hex) {
  const h = hex.replace('#', '');
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function withAlpha(hex, a) { const [r, g, b] = hexRGB(hex); return `rgba(${r},${g},${b},${a})`; }
function shade(hex, amt) { // amt -1..1  (negative = darker)
  const [r, g, b] = hexRGB(hex);
  const f = c => Math.max(0, Math.min(255, Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ============================== audio (all synthesized) ============================== */
const SND = {
  ctx: null, noiseBuf: null, muted: false, lastThud: 0, lastSplash: 0,
  ensure() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        const len = this.ctx.sampleRate * 0.5;
        this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      } catch (e) { /* no audio */ }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  blip(f0, f1, dur, type, vol) {
    if (this.muted || !this.ctx) return;
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noiseHit(dur, f0, f1, vol) {
    if (this.muted || !this.ctx || !this.noiseBuf) return;
    const t = this.ctx.currentTime;
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf;
    const flt = this.ctx.createBiquadFilter(); flt.type = 'lowpass';
    flt.frequency.setValueAtTime(f0, t);
    flt.frequency.exponentialRampToValueAtTime(Math.max(60, f1), t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(flt).connect(g).connect(this.ctx.destination);
    s.start(t); s.stop(t + dur + 0.02);
  },
  pop()  { this.noiseHit(0.10, 5200, 700, 0.5); this.blip(430, 80, 0.15, 'square', 0.22); },
  splash(v) {
    const now = performance.now();
    if (now - this.lastSplash < 140) return;
    this.lastSplash = now;
    this.noiseHit(0.16 + v * 0.12, 1400, 320, 0.10 + v * 0.22);
  },
  thud() {
    const now = performance.now();
    if (now - this.lastThud < 220) return;
    this.lastThud = now;
    this.blip(120, 52, 0.09, 'sine', 0.22);
  },
  grab() { this.blip(300, 460, 0.05, 'sine', 0.10); }
};

/* ============================== tuning ============================== */
const SIM_DT = 1 / 120;      // fixed physics step
const MAX_STEPS = 6;         // catch-up cap per frame
const ITER = 5;              // constraint iterations per step
const GRAV = 2300;           // px/s^2
const RIM_R = 5;             // rim point collision radius
const N = 22;                // rim points per balloon
const STRETCH_POP = 3.2;     // spring stretch ratio that bursts a balloon
const CRUSH_POP = 0.20;      // area fraction below which it bursts
const POP_SPEED = 2100;      // px/s impact speed that bursts it (a plain drop must NOT pop)
const SPLASH_SPEED = 420;    // px/s impact that splashes a little water
const RESTITUTION = 0.18, FLOOR_FRICTION = 0.45;

const PALETTE = [
  { rubber: '#ff6b6b', deep: '#d43f4c', water: '#5fd0ff' },
  { rubber: '#f7a531', deep: '#cf7f13', water: '#6fe0cd' },
  { rubber: '#51cf66', deep: '#2f9e44', water: '#6fe3c0' },
  { rubber: '#845ef7', deep: '#6741d9', water: '#b9b2ff' },
  { rubber: '#22b8cf', deep: '#0b8ca0', water: '#8ce8f5' },
  { rubber: '#f783ac', deep: '#d6568a', water: '#ffc2dd' },
];

/* ============================== state ============================== */
let balloons = [];
let droplets = [], shreds = [], rings = [];
let score = 0;
let lastPop = null;
const grabs = new Map(); // pointerId -> {b, idx, x, y, vx, vy, t}

/* ============================== balloon ============================== */
function makeBalloon(x, y, R, ci, rnd) {
  const pts = [];
  for (let i = 0; i < N; i++) {
    const a = -Math.PI / 2 + i * 2 * Math.PI / N;
    const px = x + Math.cos(a) * R, py = y + Math.sin(a) * R;
    pts.push({ x: px, y: py, vx: 0, vy: 0, x0: px, y0: py });
  }
  const center = { x, y, vx: 0, vy: 0, x0: x, y0: y };
  const nw = clamp(Math.round(R / 4.2), 10, 16);
  const fill = 0.72;
  const wr = Math.sqrt(fill * R * R / nw) * 0.95;
  const water = [];
  for (let i = 0; i < nw; i++) {
    const a = rnd() * Math.PI * 2, rr = rnd() * R * 0.4;
    const wx = x + Math.cos(a) * rr, wy = y + Math.sin(a) * rr;
    water.push({ x: wx, y: wy, vx: 0, vy: 0, x0: wx, y0: wy, r: wr });
  }
  return {
    pts, center, water, R,
    side: 2 * R * Math.sin(Math.PI / N),
    area0: signedArea(pts),
    col: PALETTE[ci % PALETTE.length],
    cx: x, cy: y, alive: true,
    lastSplash: 0, lastGrabT: 0,
  };
}
function signedArea(pts) {
  let a = 0;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length];
    a += p.x * q.y - q.x * p.y;
  }
  return a * 0.5;
}
function centroid(b) {
  let x = 0, y = 0;
  for (const p of b.pts) { x += p.x; y += p.y; }
  return { x: x / b.pts.length, y: y / b.pts.length };
}
function balloonArea(b) { return Math.abs(signedArea(b.pts)); }

function reset() {
  const rnd = mulberry32(20240607);
  balloons = []; droplets = []; shreds = []; rings = [];
  grabs.clear();
  score = 0; scoreEl.textContent = 'popped 0';
  const narrow = W < 560;
  const n = narrow ? 5 : 7;
  const maxR = Math.min(narrow ? 34 : 60, (W / n) * 0.42);
  for (let i = 0; i < n; i++) {
    const x = (i + 0.5) * (W / n) + (rnd() - 0.5) * 24;
    const y = 110 + rnd() * 130;
    const R = 26 + rnd() * Math.max(4, maxR - 26);
    balloons.push(makeBalloon(clamp(x, 60, W - 60), y, R, i, rnd));
  }
}

/* ============================== physics (position-based dynamics, explicit velocity) ============================== */
const VMAX = 6000; // px/s velocity clamp

function substep(h) {
  const now = performance.now();
  // 1) forces + advect positions (v is explicit px/s state; x0/y0 = pre-solve position)
  for (const b of balloons) {
    for (const p of b.pts) {
      p.floorC = false; p.wallC = false; p.ceilC = false; p.impactVy = 0; p.impactVx = 0;
      p.vy = Math.min(VMAX, p.vy + GRAV * h);
      p.x0 = p.x; p.y0 = p.y;
      p.x += p.vx * h; p.y += p.vy * h;
    }
    const c = b.center;
    c.vy = Math.min(VMAX, c.vy + GRAV * h);
    c.x0 = c.x; c.y0 = c.y;
    c.x += c.vx * h; c.y += c.vy * h;
    for (const w of b.water) {
      w.vy += GRAV * h;
      w.x0 = w.x; w.y0 = w.y;
      w.x += w.vx * h; w.y += w.vy * h;
    }
    const cen = centroid(b); b.cx = cen.x; b.cy = cen.y;
  }
  // 2) pins: position + velocity straight from the pointer
  grabs.forEach(g => {
    if (!g.b.alive) { grabs.delete(g); return; }
    if (now - g.t > 90) { g.vx *= 0.75; g.vy *= 0.75; }
    const p = g.b.pts[g.idx];
    p.x = clamp(g.x + g.ox, 8, W - 8); p.y = clamp(g.y + g.oy, 8, H - 8);
    p.vx = clamp(g.vx, -VMAX, VMAX); p.vy = clamp(g.vy, -VMAX, VMAX);
    g.b.lastGrabT = now;
  });

  const events = [];
  // 3) solve constraints on positions
  for (let it = 0; it < ITER; it++) {
    for (const b of balloons) bounds(b, events, now);
    for (const b of balloons) { sideConstraints(b); spokes(b); pressure(b); }
    balloonCollisions();
    for (const b of balloons) waterStep(b);
  }
  // judge stretch only on the fully solved state (no transient spikes)
  for (const b of balloons) {
    if (!b.alive) continue;
    let ms = 0;
    for (let i = 0; i < b.pts.length; i++) {
      const p = b.pts[i], q = b.pts[(i + 1) % b.pts.length];
      ms = Math.max(ms, Math.hypot(q.x - p.x, q.y - p.y) / b.side);
    }
    if (ms > STRETCH_POP) events.push({ type: 'pop', b, reason: 'stretch', ratio: ms });
  }
  // 4) velocity update from solved positions + contact response
  const invH = 1 / h;
  for (const b of balloons) {
    for (const p of b.pts) {
      p.vx = (p.x - p.x0) * invH * 0.999;
      p.vy = (p.y - p.y0) * invH * 0.999;
      if (p.floorC) { p.vy = -p.impactVy * RESTITUTION; p.vx *= (1 - FLOOR_FRICTION); }
      if (p.wallC) { p.vx = -p.impactVx * RESTITUTION; }
      if (p.ceilC) { p.vy = Math.abs(p.impactVy) * RESTITUTION; }
      const sp = Math.hypot(p.vx, p.vy);
      if (sp > VMAX) { p.vx *= VMAX / sp; p.vy *= VMAX / sp; }
    }
    const c = b.center;
    c.vx = (c.x - c.x0) * invH; c.vy = (c.y - c.y0) * invH;
    for (const w of b.water) {
      w.vx = (w.x - w.x0) * invH * 0.99;
      w.vy = (w.y - w.y0) * invH * 0.99;
    }
  }
  // re-assert pins so the handle follows the pointer exactly
  grabs.forEach(g => {
    if (!g.b.alive) return;
    const p = g.b.pts[g.idx];
    p.x = clamp(g.x + g.ox, 8, W - 8); p.y = clamp(g.y + g.oy, 8, H - 8);
    p.vx = clamp(g.vx, -VMAX, VMAX); p.vy = clamp(g.vy, -VMAX, VMAX);
  });

  // crush check
  for (const b of balloons) {
    if (b.alive && balloonArea(b) < CRUSH_POP * Math.abs(b.area0)) events.push({ type: 'pop', b, reason: 'crush', ratio: balloonArea(b) / Math.abs(b.area0) });
  }
  // process events (dedupe per balloon)
  const popped = new Set();
  for (const e of events) {
    if (!e.b.alive) continue;
    if (e.type === 'pop') { if (!popped.has(e.b)) { popped.add(e.b); popBalloon(e.b, e.x, e.y, e.reason, e.ratio, e.speed); } }
    else if (e.type === 'splash') splash(e.b, e.x, e.y, e.speed);
  }
  if (popped.size) balloons = balloons.filter(b => b.alive);
}

function sideConstraints(b) {
  const pts = b.pts, n = pts.length;
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    let dx = q.x - p.x, dy = q.y - p.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < 1e-6) continue;
    const diff = (d - b.side) / d * 0.85;
    dx *= diff; dy *= diff;
    p.x += dx; p.y += dy;
    q.x -= dx; q.y -= dy;
  }
}
function spokes(b) {
  const c = b.center, k = 0.06;
  for (const p of b.pts) {
    let dx = p.x - c.x, dy = p.y - c.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < 1e-6) continue;
    const diff = (d - b.R) / d * k * 0.5;
    dx *= diff; dy *= diff;
    p.x -= dx; p.y -= dy;
    c.x += dx; c.y += dy;
  }
}
function pressure(b) {
  const pts = b.pts, n = pts.length;
  let A = 0;
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    A += p.x * q.y - q.x * p.y;
  }
  A *= 0.5;
  const C = A - b.area0;
  if (Math.abs(C) < 1) return;
  let sumG2 = 0;
  const gx = new Array(n), gy = new Array(n);
  for (let i = 0; i < n; i++) {
    const prev = pts[(i - 1 + n) % n], next = pts[(i + 1) % n];
    gx[i] = 0.5 * (next.y - prev.y);
    gy[i] = 0.5 * (prev.x - next.x);
    sumG2 += gx[i] * gx[i] + gy[i] * gy[i];
  }
  if (sumG2 < 1e-6) return;
  const s = 0.7;
  const maxStep = b.R * 0.04; // cap per-point correction: prevents blow-ups when the ring folds
  for (let i = 0; i < n; i++) {
    const p = pts[i];
    let dx = -s * C / sumG2 * gx[i];
    let dy = -s * C / sumG2 * gy[i];
    const m = Math.hypot(dx, dy);
    if (m > maxStep) { dx *= maxStep / m; dy *= maxStep / m; }
    p.x += dx; p.y += dy;
  }
}

function balloonCollisions() {
  const list = balloons;
  for (let i = 0; i < list.length; i++) {
    for (let j = i + 1; j < list.length; j++) {
      const A = list[i], B = list[j];
      const dx = A.cx - B.cx, dy = A.cy - B.cy;
      if (dx * dx + dy * dy > (A.R + B.R + 40) ** 2) continue;
      collidePointsEdges(A, B);
      collidePointsEdges(B, A);
    }
  }
}
function collidePointsEdges(A, B) {
  const minD = RIM_R * 2;
  for (const p of A.pts) {
    for (let e = 0; e < B.pts.length; e++) {
      const a = B.pts[e], b2 = B.pts[(e + 1) % B.pts.length];
      const emx = (a.x + b2.x) * 0.5, emy = (a.y + b2.y) * 0.5;
      const ddx = p.x - emx, ddy = p.y - emy;
      const hl = Math.abs(b2.x - a.x) > Math.abs(b2.y - a.y)
        ? Math.abs(b2.x - a.x) : Math.abs(b2.y - a.y); // cheap half-length bound
      if (ddx * ddx + ddy * ddy > (hl + minD) * (hl + minD)) continue;
      const ex = b2.x - a.x, ey = b2.y - a.y;
      const L2 = ex * ex + ey * ey;
      if (L2 < 1e-9) continue;
      let t = ((p.x - a.x) * ex + (p.y - a.y) * ey) / L2;
      t = clamp(t, 0, 1);
      const qx = a.x + ex * t, qy = a.y + ey * t;
      let nx = p.x - qx, ny = p.y - qy;
      const d2 = nx * nx + ny * ny;
      if (d2 > minD * minD || d2 < 1e-9) continue;
      const d = Math.sqrt(d2);
      nx /= d; ny /= d;
      const push = (minD - d);
      p.x += nx * push * 0.5; p.y += ny * push * 0.5;
      a.x -= nx * push * 0.25 * (1 - t); a.y -= ny * push * 0.25 * (1 - t);
      b2.x -= nx * push * 0.25 * t; b2.y -= ny * push * 0.25 * t;
    }
  }
}

function bounds(b, events, now) {
  for (const p of b.pts) {
    // floor
    if (p.y > floorY - RIM_R) {
      p.y = floorY - RIM_R;
      p.floorC = true;
      if (p.vy > p.impactVy) p.impactVy = p.vy;
      impact(b, p.x, floorY, p.vy, events, now);
    }
    // walls
    if (p.x < RIM_R) {
      p.x = RIM_R;
      p.wallC = true;
      if (-p.vx > p.impactVx) p.impactVx = -p.vx;
      impact(b, 0, p.y, -p.vx, events, now);
    } else if (p.x > W - RIM_R) {
      p.x = W - RIM_R;
      p.wallC = true;
      if (p.vx > p.impactVx) p.impactVx = p.vx;
      impact(b, W, p.y, p.vx, events, now);
    }
    // ceiling
    if (p.y < RIM_R) {
      p.y = RIM_R;
      p.ceilC = true;
      if (-p.vy > p.impactVy) p.impactVy = -p.vy;
    }
  }
}
function impact(b, x, y, speed, events, now) {
  const userDriven = now - (b.lastGrabT || 0) < 400; // pops need a recent grab: falls splash, slams pop
  if (speed > POP_SPEED && userDriven) { events.push({ type: 'pop', b, x, y, reason: 'impact', speed: Math.round(speed) }); return; }
  if (speed > SPLASH_SPEED) {
    if (now - b.lastSplash > 180) {
      b.lastSplash = now;
      splash(b, x, y, speed);
    }
  } else if (speed > 260) {
    SND.thud();
  }
}

function splash(b, x, y, speed) {
  const n = 3 + Math.min(6, Math.round(speed / 260));
  const s = clamp((speed - 200) / 1800, 0.1, 1);
  for (let i = 0; i < n; i++) {
    if (droplets.length > 360) droplets.shift();
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.8;
    const v = (90 + Math.random() * 330) * (0.5 + s);
    droplets.push({
      x: x + (Math.random() - 0.5) * 10, y: y - 2,
      vx: Math.cos(a) * v * 0.55, vy: Math.sin(a) * v,
      r: 1.4 + Math.random() * 2.4, ttl: 0.8 + Math.random() * 0.7, life: 1,
      color: b.col.water, grounded: false,
    });
  }
  SND.splash(s);
}

function popBalloon(b, x, y, reason, ratio) {
  b.alive = false;
  lastPop = { reason: reason || 'unknown', R: Math.round(b.R), ratio: ratio != null ? +ratio.toFixed(2) : undefined, speed: arguments[5] };
  // water -> droplets
  for (const w of b.water) {
    for (let k = 0; k < 2; k++) {
      if (droplets.length > 380) droplets.shift();
      droplets.push({
        x: w.x + (Math.random() - 0.5) * 6, y: w.y + (Math.random() - 0.5) * 6,
        vx: (w.vx || 0) * 0.55 + (Math.random() - 0.5) * 260,
        vy: (w.vy || 0) * 0.55 - 60 - Math.random() * 220,
        r: 1.6 + Math.random() * 3, ttl: 1.1 + Math.random() * 0.8, life: 1,
        color: b.col.water, grounded: false,
      });
    }
  }
  // rubber shreds
  const c = centroid(b);
  for (let i = 0; i < 6; i++) {
    const a = Math.random() * Math.PI * 2;
    shreds.push({
      x: c.x, y: c.y,
      vx: Math.cos(a) * (120 + Math.random() * 300),
      vy: Math.sin(a) * (120 + Math.random() * 300) - 140,
      a: Math.random() * Math.PI * 2, va: (Math.random() - 0.5) * 14,
      len: 10 + Math.random() * 16, bend: (Math.random() - 0.5) * 14,
      ttl: 1.2 + Math.random() * 0.6, life: 1, color: b.col.rubber,
    });
  }
  rings.push({ x: c.x, y: c.y, r: b.R * 0.5, ttl: 0.45, life: 1, color: b.col.rubber });
  score++;
  scoreEl.textContent = 'popped ' + score;
  SND.pop();
  grabs.forEach((g, id) => { if (g.b === b) grabs.delete(id); });
  updateCursor();
}

function waterStep(b) {
  const ws = b.water;
  // pairwise repulsion (fills volume)
  for (let i = 0; i < ws.length; i++) {
    for (let j = i + 1; j < ws.length; j++) {
      const a = ws[i], c = ws[j];
      let dx = c.x - a.x, dy = c.y - a.y;
      const minD = a.r + c.r;
      const d2 = dx * dx + dy * dy;
      if (d2 > minD * minD || d2 < 1e-6) continue;
      const d = Math.sqrt(d2);
      const push = (minD - d) / d * 0.28;
      dx *= push * 0.5; dy *= push * 0.5;
      a.x -= dx; a.y -= dy;
      c.x += dx; c.y += dy;
    }
  }
  // keep inside rim, pushing rim outward (two-way coupling = slosh)
  const n = b.pts.length;
  for (const w of ws) {
    for (let e = 0; e < n; e++) {
      const a = b.pts[e], b2 = b.pts[(e + 1) % n];
      const ex = b2.x - a.x, ey = b2.y - a.y;
      const L2 = ex * ex + ey * ey;
      if (L2 < 1e-9) continue;
      const midx = (a.x + b2.x) * 0.5, midy = (a.y + b2.y) * 0.5;
      let nx = midx - b.cx, ny = midy - b.cy; // outward
      const nl = Math.sqrt(nx * nx + ny * ny);
      if (nl < 1e-6) continue;
      nx /= nl; ny /= nl;
      let t = ((w.x - a.x) * ex + (w.y - a.y) * ey) / L2;
      t = clamp(t, 0, 1);
      const qx = a.x + ex * t, qy = a.y + ey * t;
      const s = (w.x - qx) * nx + (w.y - qy) * ny;
      const margin = -w.r * 0.55;
      if (s > margin) {
        const c = Math.min(s - margin, 4);
        w.x -= nx * c * 0.55; w.y -= ny * c * 0.55;
        a.x += nx * c * 0.12 * (1 - t); a.y += ny * c * 0.12 * (1 - t);
        b2.x += nx * c * 0.12 * t; b2.y += ny * c * 0.12 * t;
      }
    }
  }
}

function clampBalloon(b) {
  for (const p of b.pts) {
    p.x = clamp(p.x, RIM_R, W - RIM_R);
    p.y = clamp(p.y, RIM_R, floorY - RIM_R);
  }
}

/* ============================== effects ============================== */
function updateFx(dt) {
  for (let i = droplets.length - 1; i >= 0; i--) {
    const d = droplets[i];
    if (!d.grounded) {
      d.vy += GRAV * dt;
      d.x += d.vx * dt; d.y += d.vy * dt;
      if (d.y >= floorY - d.r * 0.5) {
        d.y = floorY - d.r * 0.35; d.grounded = true;
        d.ttl = Math.min(d.ttl, 0.7);
      }
    } else {
      d.vx *= 0.8;
      d.x += d.vx * dt;
    }
    d.ttl -= dt; d.life = clamp(d.ttl * 2.2, 0, 1);
    if (d.ttl <= 0) droplets.splice(i, 1);
  }
  for (let i = shreds.length - 1; i >= 0; i--) {
    const s = shreds[i];
    s.vy += GRAV * 0.7 * dt;
    s.x += s.vx * dt; s.y += s.vy * dt; s.a += s.va * dt;
    if (s.y > floorY - 2) { s.y = floorY - 2; s.vy *= -0.3; s.vx *= 0.7; s.va *= 0.7; }
    s.ttl -= dt; s.life = clamp(s.ttl * 1.6, 0, 1);
    if (s.ttl <= 0) shreds.splice(i, 1);
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.r += 320 * dt; r.ttl -= dt; r.life = clamp(r.ttl / 0.45, 0, 1);
    if (r.ttl <= 0) rings.splice(i, 1);
  }
}

/* ============================== rendering ============================== */
const spriteCache = new Map();
function waterSprite(color) {
  let sp = spriteCache.get(color);
  if (sp) return sp;
  sp = document.createElement('canvas');
  sp.width = sp.height = 64;
  const g2 = sp.getContext('2d');
  const grad = g2.createRadialGradient(32, 32, 3, 32, 32, 32);
  const [r, g, b] = hexRGB(color);
  grad.addColorStop(0, `rgba(${r},${g},${b},1)`);
  grad.addColorStop(0.62, `rgba(${r},${g},${b},1)`);
  grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
  g2.fillStyle = grad;
  g2.fillRect(0, 0, 64, 64);
  spriteCache.set(color, sp);
  return sp;
}

function smoothPath(pts) {
  const n = pts.length;
  ctx.moveTo((pts[0].x + pts[n - 1].x) / 2, (pts[0].y + pts[n - 1].y) / 2);
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    ctx.quadraticCurveTo(p.x, p.y, (p.x + q.x) / 2, (p.y + q.y) / 2);
  }
}

function render(t) {
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, floorY);
  sky.addColorStop(0, '#a9ddf9');
  sky.addColorStop(1, '#eaf7ff');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, floorY + 1);

  // clouds
  ctx.fillStyle = 'rgba(255,255,255,.65)';
  for (const c of clouds) {
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, 46 * c.s, 15 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(c.x + 30 * c.s, c.y + 4 * c.s, 30 * c.s, 11 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(c.x - 28 * c.s, c.y + 5 * c.s, 24 * c.s, 9 * c.s, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // ground
  const gnd = ctx.createLinearGradient(0, floorY, 0, H);
  gnd.addColorStop(0, '#a3cf85');
  gnd.addColorStop(1, '#8bbd6c');
  ctx.fillStyle = gnd;
  ctx.fillRect(0, floorY, W, H - floorY);
  ctx.fillStyle = '#7fb161';
  ctx.fillRect(0, floorY, W, 3);

  // grounded droplets (puddle bits)
  for (const d of droplets) {
    if (!d.grounded) continue;
    ctx.globalAlpha = 0.55 * d.life;
    ctx.fillStyle = d.color;
    ctx.beginPath();
    ctx.ellipse(d.x, d.y, d.r * 1.8, d.r * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // shadows
  for (const b of balloons) {
    const c = { x: b.cx, y: b.cy };
    let lowest = -1e9;
    for (const p of b.pts) lowest = Math.max(lowest, p.y);
    const hgt = Math.max(0, floorY - lowest);
    const k = clamp(1 - hgt / 320, 0, 1);
    ctx.fillStyle = `rgba(40,70,40,${0.05 + 0.16 * k})`;
    ctx.beginPath();
    ctx.ellipse(c.x, floorY + 7, b.R * (0.75 + 0.5 * k), 7 * (0.5 + 0.5 * k), 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // balloons
  for (const b of balloons) drawBalloon(b);

  // airborne droplets
  for (const d of droplets) {
    if (d.grounded) continue;
    ctx.globalAlpha = 0.9 * d.life;
    ctx.fillStyle = d.color;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // shreds
  for (const s of shreds) {
    ctx.globalAlpha = 0.9 * s.life;
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.save();
    ctx.translate(s.x, s.y); ctx.rotate(s.a);
    ctx.moveTo(-s.len / 2, 0);
    ctx.quadraticCurveTo(0, s.bend, s.len / 2, 0);
    ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // pop rings
  for (const r of rings) {
    ctx.globalAlpha = 0.6 * r.life;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 3 * r.life + 0.5;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawBalloon(b) {
  const col = b.col;
  // body path
  ctx.beginPath();
  smoothPath(b.pts);
  let minY = 1e9, maxY = -1e9;
  for (const p of b.pts) { minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); }
  const grad = ctx.createLinearGradient(0, minY, 0, maxY);
  grad.addColorStop(0, shade(col.rubber, 0.22));
  grad.addColorStop(1, col.rubber);
  ctx.fillStyle = withAlpha(col.rubber, 0.88);
  ctx.fillStyle = grad;
  ctx.fill();

  // interior (clipped)
  ctx.save();
  ctx.clip();
  // inner rim shading
  ctx.beginPath(); smoothPath(b.pts);
  ctx.lineWidth = 9;
  ctx.strokeStyle = 'rgba(0,0,0,.10)';
  ctx.stroke();
  // water blob
  const sp = waterSprite(col.water);
  ctx.globalAlpha = 0.92;
  for (const w of b.water) {
    const rr = w.r * 1.35;
    ctx.drawImage(sp, w.x - rr, w.y - rr, rr * 2, rr * 2);
  }
  ctx.globalAlpha = 1;
  // depth tint at bottom
  const wg = ctx.createLinearGradient(0, b.cy - b.R * 0.2, 0, maxY);
  wg.addColorStop(0, 'rgba(0,0,0,0)');
  wg.addColorStop(1, withAlpha(col.deep, 0.18));
  ctx.fillStyle = wg;
  ctx.fillRect(b.cx - b.R * 1.6, b.cy - b.R, b.R * 3.2, b.R * 2.4);
  ctx.restore();

  // outline
  ctx.beginPath(); smoothPath(b.pts);
  ctx.lineWidth = 2.2;
  ctx.strokeStyle = withAlpha(col.deep, 0.85);
  ctx.stroke();

  // gloss
  const k = b.pts[0];
  ctx.save();
  ctx.translate(b.cx - b.R * 0.34, b.cy - b.R * 0.42);
  ctx.rotate(-0.55);
  ctx.fillStyle = 'rgba(255,255,255,.42)';
  ctx.beginPath();
  ctx.ellipse(0, 0, b.R * 0.20, b.R * 0.40, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath();
  ctx.ellipse(b.R * 0.16, b.R * 0.30, b.R * 0.06, b.R * 0.10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // knot at material point 0
  const dx = k.x - b.cx, dy = k.y - b.cy;
  const dl = Math.hypot(dx, dy) || 1;
  const nx = dx / dl, ny = dy / dl; // outward
  ctx.fillStyle = shade(col.rubber, -0.22);
  ctx.beginPath();
  ctx.arc(k.x + nx * 3, k.y + ny * 3, 4.4, 0, Math.PI * 2);
  ctx.fill();
  for (const s of [-1, 1]) {
    const px = -ny * s, py = nx * s; // tangent
    ctx.beginPath();
    ctx.moveTo(k.x + nx * 5, k.y + ny * 5);
    ctx.quadraticCurveTo(
      k.x + nx * 10 + px * 6 * s, k.y + ny * 10 + py * 6 * s,
      k.x + nx * 9 + px * 11 * s, k.y + ny * 9 + py * 11 * s
    );
    ctx.lineWidth = 2.4; ctx.strokeStyle = shade(col.rubber, -0.22);
    ctx.stroke();
  }
}

/* ============================== input ============================== */
function findTarget(x, y) {
  let best = null, bestD = 46 * 46;
  for (const b of balloons) {
    if (!b.alive) continue;
    for (let i = 0; i < b.pts.length; i++) {
      const p = b.pts[i];
      const d2 = (p.x - x) ** 2 + (p.y - y) ** 2;
      if (d2 < bestD) { bestD = d2; best = { b, idx: i }; }
    }
  }
  if (best) return best;
  // fallback: anywhere inside a balloon
  for (const b of balloons) {
    if (!b.alive) continue;
    const d = Math.hypot(b.cx - x, b.cy - y);
    if (d < b.R * 1.15 + 12) {
      let bi = 0, bd = 1e18;
      for (let i = 0; i < b.pts.length; i++) {
        const p = b.pts[i];
        const d2 = (p.x - x) ** 2 + (p.y - y) ** 2;
        if (d2 < bd) { bd = d2; bi = i; }
      }
      return { b, idx: bi };
    }
  }
  return null;
}

let lastMoveT = 0;
canvas.addEventListener('pointerdown', e => {
  SND.ensure();
  const x = e.clientX, y = e.clientY;
  const tgt = findTarget(x, y);
  if (tgt) {
    const p = tgt.b.pts[tgt.idx];
    grabs.set(e.pointerId, { b: tgt.b, idx: tgt.idx, x, y, ox: p.x - x, oy: p.y - y, vx: 0, vy: 0, t: performance.now() });
    canvas.setPointerCapture(e.pointerId);
    SND.grab();
  } else {
    rings.push({ x, y, r: 6, ttl: 0.3, life: 1, color: '#5fa8d8' });
  }
  updateCursor();
});
canvas.addEventListener('pointermove', e => {
  const g = grabs.get(e.pointerId);
  const now = e.timeStamp;
  const dt = clamp((now - lastMoveT) / 1000, 0.008, 0.05);
  lastMoveT = now;
  if (g) {
    const nvx = (e.clientX - g.x) / dt, nvy = (e.clientY - g.y) / dt;
    g.vx = g.vx * 0.55 + nvx * 0.45;
    g.vy = g.vy * 0.55 + nvy * 0.45;
    g.x = e.clientX; g.y = e.clientY;
    g.t = performance.now();
  } else {
    updateCursor(e.clientX, e.clientY);
  }
});
function release(e) {
  grabs.delete(e.pointerId);
  updateCursor();
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

function updateCursor(x, y) {
  if (grabs.size > 0) { canvas.classList.add('grabbing'); return; }
  canvas.classList.remove('grabbing');
  if (x === undefined) { canvas.style.cursor = 'default'; return; }
  canvas.style.cursor = findTarget(x, y) ? 'grab' : 'default';
}

document.getElementById('reset').addEventListener('click', () => { SND.ensure(); reset(); });
const muteBtn = document.getElementById('mute');
function toggleMute() {
  SND.muted = !SND.muted;
  muteBtn.textContent = SND.muted ? '🔇' : '🔊';
  muteBtn.setAttribute('aria-label', SND.muted ? 'Unmute sound' : 'Mute sound');
}
muteBtn.addEventListener('click', () => { SND.ensure(); toggleMute(); });
window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') { SND.ensure(); reset(); }
  if (e.key === 'm' || e.key === 'M') { SND.ensure(); toggleMute(); }
});
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { last = performance.now(); acc = 0; });

/* ============================== main loop ============================== */
let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1;
  acc += dt;
  let steps = 0;
  while (acc >= SIM_DT && steps < MAX_STEPS) { substep(SIM_DT); acc -= SIM_DT; steps++; }
  if (steps === MAX_STEPS) acc = 0; // drop backlog, never spiral
  updateFx(Math.min(dt, 0.033));
  render(now / 1000);
}

/* tiny debug hook (used by automated tests) */
window.__wb = {
  count: () => balloons.length,
  score: () => score,
  centroids: () => balloons.map(b => [Math.round(b.cx), Math.round(b.cy)]),
  lastPop: () => lastPop,
  ptSpeeds: () => balloons.map(b => b.pts.map(p => Math.round(Math.hypot(p.vx, p.vy)))),
  health: () => balloons.map(b => {
    let ms = 0;
    for (let i = 0; i < b.pts.length; i++) {
      const p = b.pts[i], q = b.pts[(i + 1) % b.pts.length];
      ms = Math.max(ms, Math.hypot(q.x - p.x, q.y - p.y) / b.side);
    }
    return { area: +(balloonArea(b) / Math.abs(b.area0)).toFixed(3), stretch: +ms.toFixed(3) };
  }),
  speeds: () => balloons.map(b => Math.round(Math.hypot(b.cx - centroid(b).x, 0))),
  grabbed: () => grabs.size,
  sample: () => {
    const cs = document.querySelector('canvas').getContext('2d');
    const px = (x, y) => Array.from(cs.getImageData(Math.round(x), Math.round(y), 1, 1).data).slice(0, 3);
    return balloons.map(b => ({
      R: Math.round(b.R), rubber: b.col.rubber, water: b.col.water,
      center: px(b.cx, b.cy),
      bottom: px(b.cx, b.cy + b.R * 0.45),
      top: px(b.cx, b.cy - b.R * 0.75),
    }));
  },
  reset
};

resize();
reset();
requestAnimationFrame(frame);
})();
</script>
</body>
