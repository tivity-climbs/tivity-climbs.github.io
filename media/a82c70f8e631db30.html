<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111820">
<title>Gummy bears — a squishy pile you can fling</title>
<style>
  :root{
    --ink:#f4efe7;
    --ink-dim:rgba(244,239,231,.62);
    --ink-faint:rgba(244,239,231,.38);
    --pill:rgba(255,255,255,.055);
    --pill-line:rgba(255,255,255,.13);
    --pill-hover:rgba(255,255,255,.11);
    --focus:#8fe3ff;
    --type: ui-rounded, "SF Pro Rounded", "Avenir Next", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:#0d131a;overscroll-behavior:none}
  body{
    font-family:var(--type);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }
  #stage{
    position:fixed;inset:0;width:100%;height:100%;display:block;
    touch-action:none;cursor:default;
  }
  #stage.over-bear{cursor:grab}
  #stage.dragging{cursor:grabbing}

  .title{
    position:fixed;left:clamp(14px,3vw,34px);top:clamp(12px,2.6vh,26px);
    pointer-events:none;max-width:min(70vw,470px);
    text-shadow:0 2px 18px rgba(4,8,14,.75);
  }
  .title h1{
    margin:0;font-size:clamp(23px,3.1vw,36px);font-weight:600;letter-spacing:-.012em;
  }
  .title p{
    margin:.42em 0 0;font-size:clamp(12.5px,1.25vw,15px);line-height:1.45;
    color:var(--ink-dim);max-width:36ch;
  }
  kbd{
    font-family:inherit;font-size:.86em;
    padding:.08em .42em .16em;margin:0 .06em;
    border-radius:6px;border:1px solid rgba(255,255,255,.2);
    background:rgba(255,255,255,.07);color:var(--ink);
  }

  .bar{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:clamp(12px,2.4vh,26px);
    display:flex;align-items:center;gap:8px;
    padding:7px;border-radius:999px;
    background:rgba(10,15,21,.55);
    border:1px solid var(--pill-line);
    box-shadow:0 12px 34px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(9px) saturate(1.1);
    -webkit-backdrop-filter:blur(9px) saturate(1.1);
  }
  button{
    font-family:inherit;font-size:14.5px;font-weight:600;letter-spacing:.005em;
    color:var(--ink);
    padding:9px 16px 10px;border-radius:999px;
    border:1px solid var(--pill-line);
    background:var(--pill);
    cursor:pointer;
    transition:background .16s ease, transform .12s ease, border-color .16s ease, opacity .16s;
    touch-action:manipulation;
  }
  button:hover{background:var(--pill-hover);border-color:rgba(255,255,255,.24)}
  button:active{transform:translateY(1px) scale(.985)}
  button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  button[disabled]{opacity:.34;cursor:not-allowed}
  button.primary{
    background:linear-gradient(180deg,#fff5e2,#ffe2ad);
    color:#2a1c06;border-color:rgba(255,224,150,.7);
    box-shadow:0 4px 16px rgba(255,196,90,.22);
  }
  button.primary:hover{background:linear-gradient(180deg,#fffaf0,#ffe9bf)}
  .count{
    padding:0 10px 0 8px;font-size:13px;color:var(--ink-faint);
    font-variant-numeric:tabular-nums;min-width:70px;
  }
  .sig{
    position:fixed;right:clamp(12px,2.4vw,26px);bottom:clamp(12px,2.4vh,26px);
    font-size:11.5px;color:var(--ink-faint);letter-spacing:.03em;pointer-events:none;
  }
  @media (max-width:600px){
    .count{display:none}
    button{padding:9px 13px 10px;font-size:13.5px}
    .sig{display:none}
  }
  @media (prefers-reduced-motion: reduce){
    button{transition:none}
  }
</style>
</head>
<body>
<canvas id="stage" role="img"
        aria-label="A pile of translucent gummy bears on a dark counter. Use a mouse or a finger to grab, pull, squash and fling them."></canvas>

<div class="title">
  <h1>Gummy bears</h1>
  <p>Grab one, pull it, squash it flat, let go. Press <kbd>R</kbd> for a fresh pile, <kbd>A</kbd> to drop another.</p>
</div>

<div class="bar" role="toolbar" aria-label="Gummy bear controls">
  <span class="count" id="count">0 bears</span>
  <button id="reset" class="primary" type="button" aria-label="Reset the pile of gummy bears">Reset</button>
  <button id="add" type="button" aria-label="Drop another gummy bear onto the pile">Add a bear</button>
  <button id="sound" type="button" aria-pressed="true" aria-label="Toggle candy sound effects">Sound on</button>
</div>

<div class="sig">soft body · Verlet + shape matching</div>

<script>
(function(){
"use strict";

/* ============================================================
   Gummy bears — single-file soft-body candy playground
   Physics : Verlet particles + shape matching + area (pressure)
             + edge & bending springs, proxy-circle contacts,
             uniform-grid broadphase, clamped fixed timestep.
   Graphics: canvas 2D, one light source (upper left), additive
             subsurface glow, low-res shadow + caustic buffers.
   ============================================================ */

/* ---------------- math helpers ---------------- */
var TAU = Math.PI * 2;
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function mulberry32(seed){
  var a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function rgba(c,a){ return "rgba("+c[0]+","+c[1]+","+c[2]+","+a+")"; }
function mix(a,b,t){ return [a[0]+(b[0]-a[0])*t|0, a[1]+(b[1]-a[1])*t|0, a[2]+(b[2]-a[2])*t|0]; }

/* ---------------- candy palette ---------------- */
var CANDY = [
  { name:"cherry",    hi:"#ffc0cb", mid:"#ff3f63", deep:"#790b2a", glow:"#ff5f7e" },
  { name:"tangerine", hi:"#ffdcae", mid:"#ff8a1c", deep:"#7d3304", glow:"#ffa23c" },
  { name:"lemon",     hi:"#fff6b8", mid:"#ffd21c", deep:"#7c5c00", glow:"#ffe357" },
  { name:"apple",     hi:"#cbf9cd", mid:"#33d469", deep:"#0b5b28", glow:"#63e88d" },
  { name:"grape",     hi:"#e2c9ff", mid:"#9a5cff", deep:"#341270", glow:"#b483ff" },
  { name:"blue rasp", hi:"#c4efff", mid:"#2fbfff", deep:"#08466f", glow:"#63d7ff" },
  { name:"cola",      hi:"#ffd9b3", mid:"#d2691e", deep:"#4a1c05", glow:"#e08a44" },
  { name:"melon",     hi:"#ffd7e2", mid:"#ff6f91", deep:"#6d1330", glow:"#ff92ab" }
].map(function(p){
  return { name:p.name, hi:hexRGB(p.hi), mid:hexRGB(p.mid), deep:hexRGB(p.deep), glow:hexRGB(p.glow) };
});

/* ============================================================
   1. Silhouette — metaball union of the classic gummy-bear
      blobs, isosurface found by ray-march, resampled by arc
      length, lightly smoothed, normalised to height 1.
   ============================================================ */
var SIL = [
  [ 0.000,-0.300, 0.180],  // head
  [-0.152,-0.437, 0.086],  // ear L
  [ 0.152,-0.437, 0.086],  // ear R
  [ 0.000,-0.135, 0.142],  // neck
  [-0.268,-0.070, 0.096],  // arm L
  [ 0.268,-0.070, 0.096],  // arm R
  [ 0.000,-0.020, 0.158],  // chest
  [ 0.000, 0.105, 0.170],  // belly
  [ 0.000, 0.205, 0.168],  // hips
  [-0.112, 0.318, 0.112],  // leg L
  [ 0.112, 0.318, 0.112]   // leg R
];
function silField(x,y){
  var s=0;
  for(var i=0;i<SIL.length;i++){
    var b=SIL[i], dx=x-b[0], dy=y-b[1];
    var d2=dx*dx+dy*dy;
    s += (b[2]*b[2])/(d2<1e-6?1e-6:d2);
  }
  return s;
}

var SHAPE = null;                 // { pts, cxm, cym, h } — built once at boot

function buildShape(N){
  var m = 720, raw = [], i, k, r;
  var STEP = 0.0016, RMAX = 0.74;
  for(i=0;i<m;i++){
    var a = (i/m)*TAU, ux = Math.cos(a), uy = Math.sin(a);
    var lastIn = -1, nextOut = -1, prevIn = false;
    for(r=0.02; r<RMAX; r+=STEP){
      var ins = silField(ux*r, uy*r) >= 1;
      if(ins){ lastIn = r; nextOut = -1; }
      else if(prevIn){ nextOut = r; }
      prevIn = ins;
    }
    if(lastIn < 0){ raw.push({x:ux*0.12, y:uy*0.12}); continue; }
    var lo = lastIn, hi = (nextOut>0? nextOut : lastIn+STEP);
    for(k=0;k<14;k++){
      var mid = (lo+hi)*0.5;
      if(silField(ux*mid, uy*mid) >= 1) lo = mid; else hi = mid;
    }
    var rr = (lo+hi)*0.5;
    raw.push({x:ux*rr, y:uy*rr});
  }

  /* resample at even arc length */
  var L = 0;
  for(i=0;i<m;i++){ var p=raw[i], q=raw[(i+1)%m]; L += Math.hypot(q.x-p.x, q.y-p.y); }
  var pts = [], need = L/N, acc = 0;
  pts.push({x:raw[0].x, y:raw[0].y});
  for(i=0;i<m && pts.length<N;i++){
    var A=raw[i], B=raw[(i+1)%m];
    var seg = Math.hypot(B.x-A.x, B.y-A.y);
    while(acc+seg >= need && pts.length<N){
      var t = (need-acc)/seg;
      pts.push({x:A.x+(B.x-A.x)*t, y:A.y+(B.y-A.y)*t});
      need += L/N;
    }
    acc += seg;
  }
  while(pts.length<N) pts.push({x:pts[pts.length-1].x, y:pts[pts.length-1].y});

  /* mild laplacian smoothing on the closed loop */
  for(k=0;k<3;k++){
    var sm = pts.map(function(p){ return {x:p.x, y:p.y}; });
    for(i=0;i<N;i++){
      var pr=sm[(i-1+N)%N], nx=sm[(i+1)%N], cu=sm[i];
      pts[i].x = cu.x + ((pr.x+nx.x)*0.5-cu.x)*0.30;
      pts[i].y = cu.y + ((pr.y+nx.y)*0.5-cu.y)*0.30;
    }
  }

  /* normalise: bbox centred at origin, height = 1 */
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for(i=0;i<N;i++){
    if(pts[i].x<minX)minX=pts[i].x; if(pts[i].x>maxX)maxX=pts[i].x;
    if(pts[i].y<minY)minY=pts[i].y; if(pts[i].y>maxY)maxY=pts[i].y;
  }
  var h=(maxY-minY), cxm=(minX+maxX)/2, cym=(minY+maxY)/2;
  for(i=0;i<N;i++){ pts[i].x=(pts[i].x-cxm)/h; pts[i].y=(pts[i].y-cym)/h; }
  return { pts:pts, cxm:cxm, cym:cym, h:h };
}

/* collision proxies: 6 circles that tile the rest shape (deterministic
   k-means over the outline), so contact starts at the real surface */
function proxiesFrom(pts){
  var n = pts.length, K = 6, it, i, k;
  var cx = [], cy = [], asg = new Int32Array(n), r = new Float64Array(K);
  for(k=0;k<K;k++){ var s = pts[Math.round(k*n/K)%n]; cx.push(s.x); cy.push(s.y); }
  for(it=0; it<16; it++){
    var sumx=new Float64Array(K), sumy=new Float64Array(K), cnt=new Int32Array(K);
    for(i=0;i<n;i++){
      var best=0, bd=1e9;
      for(k=0;k<K;k++){
        var ddx=pts[i].x-cx[k], ddy=pts[i].y-cy[k], d2=ddx*ddx+ddy*ddy;
        if(d2<bd){ bd=d2; best=k; }
      }
      asg[i]=best; sumx[best]+=pts[i].x; sumy[best]+=pts[i].y; cnt[best]++;
    }
    for(k=0;k<K;k++) if(cnt[k]){ cx[k]=sumx[k]/cnt[k]; cy[k]=sumy[k]/cnt[k]; }
  }
  for(k=0;k<K;k++){
    r[k]=0;
    for(i=0;i<n;i++) if(asg[i]===k){
      var q=Math.hypot(pts[i].x-cx[k], pts[i].y-cy[k]);
      if(q>r[k]) r[k]=q;
    }
    if(r[k] < 0.03) r[k] = 0.03;
    r[k] *= 0.94;
  }
  var out=[];
  for(k=0;k<K;k++) out.push({x:cx[k], y:cy[k], r:r[k]});
  return out;
}

/* shaded features, authored in raw silhouette space */
var FEAT_RAW = {
  eyeL:[-0.076,-0.318], eyeR:[0.076,-0.318], muzzle:[0,-0.242],
  specHead:[-0.086,-0.402], specArm:[-0.243,-0.086], specHip:[0.086,0.175]
};

/* ============================================================
   2. Bear
   ============================================================ */
var SUBSTEP = 1/120, ITERS = 4, GRAV = 2500;

function Bear(cx,cy,size,rot,pal,rng){
  var pts = SHAPE.pts, n = pts.length, i;
  this.n = n; this.size = size; this.pal = pal;
  this.rx = new Float64Array(n); this.ry = new Float64Array(n);
  this.x  = new Float64Array(n); this.y  = new Float64Array(n);
  this.px = new Float64Array(n); this.py = new Float64Array(n);
  this.el = new Float64Array(n); this.bl = new Float64Array(n);
  this.rd = new Float64Array(n);
  this.devx = new Float64Array(n); this.devy = new Float64Array(n);

  var co=Math.cos(rot), si=Math.sin(rot);
  for(i=0;i<n;i++){
    var X = pts[i].x*size, Y = pts[i].y*size;
    this.rx[i]=X; this.ry[i]=Y;                      /* rest pose, still bbox-centred */
    this.x[i]=cx + X*co - Y*si;  this.y[i]=cy + X*si + Y*co;
    var j=(i+1)%n, k=(i+2)%n;
    this.el[i]=Math.hypot(pts[j].x-pts[i].x, pts[j].y-pts[i].y)*size;
    this.bl[i]=Math.hypot(pts[k].x-pts[i].x, pts[k].y-pts[i].y)*size;
  }
  /* re-centre the rest pose on its own centroid: shape matching must not
     drag the body toward wherever the bounding box happened to sit */
  var mrx=0, mry=0;
  for(i=0;i<n;i++){ mrx+=this.rx[i]; mry+=this.ry[i]; }
  mrx/=n; mry/=n;
  for(i=0;i<n;i++){
    this.rx[i]-=mrx; this.ry[i]-=mry;
    this.rd[i]=Math.hypot(this.rx[i], this.ry[i]);    // rest radius from centroid
    this.x[i]-=mrx*co - mry*si;  this.y[i]-=mrx*si + mry*co;
  }
  var A=0;
  for(i=0;i<n;i++){ var a=pts[i], b2=pts[(i+1)%n]; A += a.x*b2.y - b2.x*a.y; }
  this.restArea = Math.abs(A*0.5)*size*size;

  var vx0=(rng()-0.5)*45, vy0=-rng()*35;
  for(i=0;i<n;i++){ this.px[i]=this.x[i]-vx0*SUBSTEP; this.py[i]=this.y[i]-vy0*SUBSTEP; }

  this.proxiesDef = proxiesFrom(pts);
  for(i=0;i<this.proxiesDef.length;i++){
    this.proxiesDef[i].x -= mrx/size; this.proxiesDef[i].y -= mry/size;
  }
  this.proxies = this.proxiesDef.map(function(p){ return {x:p.x,y:p.y,r:p.r*size}; });

  this.feat = {};
  for(var key in FEAT_RAW){
    var rawf=FEAT_RAW[key];
    var fx=(rawf[0]-SHAPE.cxm)/SHAPE.h*size - mrx, fy=(rawf[1]-SHAPE.cym)/SHAPE.h*size - mry;
    var nb=[], tot=0;
    for(i=0;i<n;i++){
      var d = Math.hypot(this.rx[i]-fx, this.ry[i]-fy);
      nb.push({i:i, w:1/(d+0.02*size)});
    }
    nb.sort(function(a,b){ return a.w<b.w?1:-1; });
    for(i=0;i<4;i++) tot+=nb[i].w;
    for(i=0;i<4;i++) nb[i].w/=tot;
    this.feat[key]=nb.slice(0,4);
  }

  this.ccx=cx; this.ccy=cy; this.theta=rot; this.rad=size*0.5;
  this.held=0; this.grab=null; this.grounded=false; this.wasGrounded=false;
  this.lastImpact=0; this.thPrev=rot;
}

Bear.prototype.fit = function(){
  var n=this.n, i, sx=0, sy=0, size=this.size;
  for(i=0;i<n;i++){ sx+=this.x[i]; sy+=this.y[i]; }
  var cx=sx/n, cy=sy/n, a=0, b=0;
  for(i=0;i<n;i++){
    var dx=this.x[i]-cx, dy=this.y[i]-cy;
    a += this.rx[i]*dx + this.ry[i]*dy;
    b += this.rx[i]*dy - this.ry[i]*dx;
  }
  if(Math.hypot(a,b) > 1e-5) this.theta = Math.atan2(b,a);
  this.ccx=cx; this.ccy=cy;
  var co=Math.cos(this.theta), si=Math.sin(this.theta), rmax=0;
  for(i=0;i<n;i++){
    var tx=cx + this.rx[i]*co - this.ry[i]*si;
    var ty=cy + this.rx[i]*si + this.ry[i]*co;
    this.devx[i]=this.x[i]-tx; this.devy[i]=this.y[i]-ty;
    var dd=Math.hypot(this.x[i]-cx, this.y[i]-cy);
    if(dd>rmax) rmax=dd;
  }
  this.rad=rmax;
  for(i=0;i<this.proxies.length;i++){
    var d=this.proxiesDef[i];
    this.proxies[i].x = cx + (d.x*co - d.y*si)*size;
    this.proxies[i].y = cy + (d.x*si + d.y*co)*size;
  }
};

/* bears are bottom-heavy in sugar: a weak righting moment keeps the
   silhouette readable instead of every bear ending up on its side */
Bear.prototype.right = function(k){
  var t=this.theta;
  t = Math.atan2(Math.sin(t), Math.cos(t));           /* wrap to -pi..pi */
  if(Math.abs(t) > Math.PI*0.62) return;              /* pinned over: leave it */
  var target = t*(1-clamp(k,0,1));
  this.rotateBy(target-t);
};

Bear.prototype.mapPoint = function(name){
  var f=this.feat[name]; if(!f) return {x:this.ccx,y:this.ccy};
  var co=Math.cos(this.theta), si=Math.sin(this.theta), i, rx=0, ry=0, dx=0, dy=0;
  for(i=0;i<f.length;i++){
    var w=f[i].w, k=f[i].i;
    rx+=this.rx[k]*w; ry+=this.ry[k]*w;
    dx+=this.devx[k]*w; dy+=this.devy[k]*w;
  }
  return { x:this.ccx + rx*co - ry*si + dx, y:this.ccy + rx*si + ry*co + dy };
};

Bear.prototype.integrate = function(dt, damp, gravScale){
  var n=this.n, dt2=dt*dt, i, maxv=this.size*0.32, g=GRAV*gravScale*dt2;
  for(i=0;i<n;i++){
    var x=this.x[i], y=this.y[i];
    var vx=(x-this.px[i])*damp, vy=(y-this.py[i])*damp;
    var sp=Math.sqrt(vx*vx+vy*vy);
    if(sp>maxv){ vx*=maxv/sp; vy*=maxv/sp; }
    this.px[i]=x; this.py[i]=y;
    this.x[i]=x+vx; this.y[i]=y+vy+g;
  }
};

/* rigid moves that never inject velocity (prev positions move with them) */
Bear.prototype.translate = function(dx, dy){
  for(var k=0;k<this.n;k++){
    this.x[k]+=dx; this.y[k]+=dy; this.px[k]+=dx; this.py[k]+=dy;
  }
};
Bear.prototype.rotateBy = function(ang){
  if(!ang) return;
  var co=Math.cos(ang), si=Math.sin(ang), cx=this.ccx, cy=this.ccy, k, qx, qy;
  for(k=0;k<this.n;k++){
    qx=this.x[k]-cx; qy=this.y[k]-cy;
    this.x[k]=cx+qx*co-qy*si; this.y[k]=cy+qx*si+qy*co;
    qx=this.px[k]-cx; qy=this.py[k]-cy;
    this.px[k]=cx+qx*co-qy*si; this.py[k]=cy+qx*si+qy*co;
  }
};

/* hard limit on how far a particle may wander from its own rest radius:
   the bear can squash and stretch, but can never be turned inside out */
Bear.prototype.solveRadial = function(k){
  var n=this.n, i;
  for(i=0;i<n;i++){
    var lo=this.rd[i]*0.55, hi=this.rd[i]*1.55;
    var dx=this.x[i]-this.ccx, dy=this.y[i]-this.ccy;
    var d=Math.sqrt(dx*dx+dy*dy);
    if(d<1e-4) continue;
    if(d<lo){ var f1=1+(lo/d-1)*k; this.x[i]=this.ccx+dx*f1; this.y[i]=this.ccy+dy*f1; }
    else if(d>hi){ var f2=1-(1-hi/d)*k; this.x[i]=this.ccx+dx*f2; this.y[i]=this.ccy+dy*f2; }
  }
};

/* bleed a little internal wiggle into the bear's rigid motion so the
   pile can actually come to rest — jiggle survives, boiling does not */
Bear.prototype.speed = function(){
  var s=0;
  for(var i=0;i<this.n;i++) s+=Math.abs(this.x[i]-this.px[i])+Math.abs(this.y[i]-this.py[i]);
  this.spd = s/this.n;
  return this.spd;
};

Bear.prototype.settle = function(dt, k){
  var n=this.n, i, vcx=0, vcy=0;
  for(i=0;i<n;i++){ vcx+=this.x[i]-this.px[i]; vcy+=this.y[i]-this.py[i]; }
  vcx/=n; vcy/=n;
  var om=clamp((this.theta-this.thPrev)/dt, -14, 14);
  var co=Math.cos(om*dt), si=Math.sin(om*dt);
  for(i=0;i<n;i++){
    var dx=this.x[i]-this.ccx, dy=this.y[i]-this.ccy;
    var rvx = vcx + (dx*co - dy*si - dx);
    var rvy = vcy + (dx*si + dy*co - dy);
    var vx=this.x[i]-this.px[i], vy=this.y[i]-this.py[i];
    this.px[i]=this.x[i]-lerp(vx,rvx,k);
    this.py[i]=this.y[i]-lerp(vy,rvy,k);
  }
};

Bear.prototype.solveShape = function(k){
  var n=this.n, co=Math.cos(this.theta), si=Math.sin(this.theta), i;
  for(i=0;i<n;i++){
    var tx=this.ccx + this.rx[i]*co - this.ry[i]*si;
    var ty=this.ccy + this.rx[i]*si + this.ry[i]*co;
    this.x[i]+= (tx-this.x[i])*k;
    this.y[i]+= (ty-this.y[i])*k;
  }
};

Bear.prototype.solveEdges = function(k, kb){
  var n=this.n, i;
  for(i=0;i<n;i++){
    var j=(i+1)%n;
    var dx=this.x[j]-this.x[i], dy=this.y[j]-this.y[i];
    var d=Math.sqrt(dx*dx+dy*dy); if(d<1e-6) continue;
    var f=(d-this.el[i])/d*0.5*k;
    this.x[i]+=dx*f; this.y[i]+=dy*f;
    this.x[j]-=dx*f; this.y[j]-=dy*f;
  }
  for(i=0;i<n;i++){
    var k2=(i+2)%n;
    var ex=this.x[k2]-this.x[i], ey=this.y[k2]-this.y[i];
    var ed=Math.sqrt(ex*ex+ey*ey); if(ed<1e-6) continue;
    var g=(ed-this.bl[i])/ed*0.5*kb;
    this.x[i]+=ex*g; this.y[i]+=ey*g;
    this.x[k2]-=ex*g; this.y[k2]-=ey*g;
  }
};

/* gas/pressure: keep the polygon's area near its rest area */
Bear.prototype.solveArea = function(k){
  var n=this.n, i, A=0;
  for(i=0;i<n;i++){
    var j=(i+1)%n;
    A += this.x[i]*this.y[j] - this.x[j]*this.y[i];
  }
  A = Math.abs(A*0.5);
  if(A < 2) return;
  var f = clamp(1 + (Math.sqrt(this.restArea/A) - 1)*k, 0.90, 1.12);
  for(i=0;i<n;i++){
    this.x[i]=this.ccx+(this.x[i]-this.ccx)*f;
    this.y[i]=this.ccy+(this.y[i]-this.ccy)*f;
  }
};

Bear.prototype.solveGrab = function(ptr){
  var g=this.grab; if(!g) return;
  for(var i=0;i<g.idx.length;i++){
    var tx=ptr.x+g.off[i*2], ty=ptr.y+g.off[i*2+1];
    tx=clamp(tx,g.minX,g.maxX); ty=clamp(ty,g.minY,g.maxY);
    var k=0.30*g.w[i], q=g.idx[i];
    this.x[q] += (tx-this.x[q])*k;
    this.y[q] += (ty-this.y[q])*k;
  }
};

/* ============================================================
   3. World
   ============================================================ */
var canvas = document.getElementById("stage");
var ctx = canvas.getContext("2d", { alpha:false });
var W=0, H=0, dpr=1, prevW=0, prevH=0;
var bg = document.createElement("canvas"), bgx = bg.getContext("2d", {alpha:false});
var shBuf = document.createElement("canvas"), shx = shBuf.getContext("2d");
var caBuf = document.createElement("canvas"), cax = caBuf.getContext("2d");
var BUF = 0.34;                       // low-res buffers => soft, cheap blur

var bears = [], pairs = [];
var seeds = { pile:20240610 };
var extraSeed = 5000;
var MAXBEARS = 30;
var quality = 2;
var reduced = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
var LIGHT = { x:-0.5547, y:-0.8321 };  // normalised: light comes from upper left

function floorY(){ return H*0.955; }

function resize(){
  var cw = Math.max(320, window.innerWidth|0);
  var ch = Math.max(320, window.innerHeight|0);
  dpr = Math.min(window.devicePixelRatio||1, (cw*ch > 1600*950) ? 1.5 : 2);
  var sx = prevW? cw/prevW : 1, sy = prevH? ch/prevH : 1;
  W = cw; H = ch;
  canvas.width  = Math.round(W*dpr);
  canvas.height = Math.round(H*dpr);
  canvas.style.width = W+"px";
  canvas.style.height = H+"px";
  bg.width = canvas.width; bg.height = canvas.height;
  shBuf.width = Math.max(2, Math.round(W*BUF));
  shBuf.height= Math.max(2, Math.round(H*BUF));
  caBuf.width = shBuf.width; caBuf.height = shBuf.height;
  paintBackground();
  if(prevW && (sx!==1 || sy!==1)){
    var s=Math.min(sx,sy);
    for(var i=0;i<bears.length;i++){
      var b=bears[i];
      for(var j=0;j<b.n;j++){ b.x[j]*=sx; b.y[j]*=sy; b.px[j]*=sx; b.py[j]*=sy; }
      b.size*=s; b.rad*=s;
      for(var p=0;p<b.proxies.length;p++) b.proxies[p].r = b.proxiesDef[p].r*b.size;
      b.restArea*=s*s;
      for(var e=0;e<b.n;e++){ b.el[e]*=s; b.bl[e]*=s; }
    }
  }
  prevW=W; prevH=H;
}

/* ---- the counter: dark, one soft light, a dusting of sugar ---- */
function paintBackground(){
  var s=dpr, i;
  bgx.setTransform(s,0,0,s,0,0);
  var g = bgx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#0e1621"); g.addColorStop(0.46,"#141d28");
  g.addColorStop(0.72,"#1a2430"); g.addColorStop(1,"#0c1218");
  bgx.fillStyle=g; bgx.fillRect(0,0,W,H);

  var lg = bgx.createRadialGradient(W*0.30,-H*0.16,0, W*0.30,-H*0.16, Math.max(W,H)*0.95);
  lg.addColorStop(0,"rgba(176,206,255,0.20)");
  lg.addColorStop(0.45,"rgba(140,175,225,0.07)");
  lg.addColorStop(1,"rgba(0,0,0,0)");
  bgx.fillStyle=lg; bgx.fillRect(0,0,W,H);

  var fy=floorY(), top=fy-H*0.30;
  var cg = bgx.createLinearGradient(0,top,0,H);
  cg.addColorStop(0,"rgba(255,255,255,0)");
  cg.addColorStop(0.55,"rgba(190,210,235,0.035)");
  cg.addColorStop(1,"rgba(215,228,245,0.075)");
  bgx.fillStyle=cg; bgx.fillRect(0,top,W,H-top);
  bgx.fillStyle="rgba(255,255,255,0.05)";
  bgx.fillRect(0,fy,W,Math.max(1,1*s));

  var rng=mulberry32(7);
  for(i=0;i<1500;i++){
    var x=rng()*W, y=lerp(top, H, rng()*rng()*1.15);
    var a=0.02+rng()*0.16, r=rng()*rng()*1.5+0.25;
    bgx.fillStyle="rgba(226,238,255,"+a.toFixed(3)+")";
    bgx.beginPath(); bgx.arc(x,y,r,0,TAU); bgx.fill();
  }
  for(i=0;i<90;i++){
    var sx=rng()*W, sy=lerp(fy-6, H, rng());
    bgx.fillStyle="rgba(255,255,255,"+(0.05+rng()*0.14).toFixed(3)+")";
    bgx.save(); bgx.translate(sx,sy); bgx.rotate(rng()*TAU);
    bgx.fillRect(-1.6,-0.5,3.2,1.0); bgx.restore();
  }

  var vg=bgx.createRadialGradient(W*0.5,H*0.46,Math.min(W,H)*0.30, W*0.5,H*0.5,Math.max(W,H)*0.78);
  vg.addColorStop(0,"rgba(0,0,0,0)");
  vg.addColorStop(1,"rgba(2,4,8,0.66)");
  bgx.fillStyle=vg; bgx.fillRect(0,0,W,H);
}

/* ---- deterministic pile ---- */
function bearSize(){ return clamp(Math.min(W,H)*0.185, 78, 190); }
function targetCount(){ return clamp(Math.round((W/(bearSize()*1.16))*2.1), 6, 18); }

function makePile(seed){
  bears.length=0; pointers.length=0;
  var rng = mulberry32(seed);
  var n = targetCount(), size = bearSize();
  var cols = clamp(Math.round(Math.sqrt(n*1.6)), 3, 6);   /* a mound, not a queue */
  var gap = size*1.06;                                     /* never spawn inside each other */
  var startX = W*0.5 - (cols-1)*gap*0.5;
  var fy = floorY();
  for(var i=0;i<n;i++){
    var col = i % cols, row = Math.floor(i/cols);
    var x = startX + col*gap + (rng()-0.5)*size*0.10 + (row%2 ? gap*0.5 : 0);
    var y = fy - size*0.56 - row*size*1.02 - rng()*size*0.05;
    if(!reduced) y -= size*0.6 + rng()*H*0.16;      // dumped from above
    var pal = (i%3===2) ? CANDY[(i+3)%CANDY.length] : CANDY[i%CANDY.length];
    bears.push(new Bear(clamp(x, size*0.45, W-size*0.45), Math.max(size*0.5,y), size,
                        (rng()-0.5)*0.5, pal, rng));
  }
  extraSeed = seed + 17;
}

function addBear(){
  if(bears.length>=MAXBEARS) return false;
  var rng = mulberry32(extraSeed++);
  var size = bearSize()*(0.80+rng()*0.38);
  var x = W*(0.16+rng()*0.68);
  var pal = CANDY[Math.floor(rng()*CANDY.length)];
  var b = new Bear(x, -size*0.6, size, (rng()-0.5)*1.2, pal, rng);
  var vx=(rng()-0.5)*170;
  for(var i=0;i<b.n;i++){ b.px[i]=b.x[i]-vx*SUBSTEP; b.py[i]=b.y[i]-250*SUBSTEP; }
  bears.push(b);
  return true;
}

/* ---- broadphase: uniform grid over bear bounding circles ---- */
function buildPairs(){
  pairs.length=0;
  var cs = Math.max(40, bearSize()*1.25);
  var grid = Object.create(null), i, j;
  for(i=0;i<bears.length;i++){
    var b=bears[i], r=b.rad*1.05;
    var x0=Math.floor((b.ccx-r)/cs), x1=Math.floor((b.ccx+r)/cs);
    var y0=Math.floor((b.ccy-r)/cs), y1=Math.floor((b.ccy+r)/cs);
    for(var gy=y0;gy<=y1;gy++) for(var gx=x0;gx<=x1;gx++){
      var key=gx+"_"+gy;
      (grid[key] || (grid[key]=[])).push(i);
    }
  }
  var seen = Object.create(null);
  for(var k in grid){
    var cell=grid[k];
    for(i=0;i<cell.length;i++) for(j=i+1;j<cell.length;j++){
      var a=cell[i], c=cell[j]; if(a>c){ var t=a; a=c; c=t; }
      var pk=a*1000+c;
      if(seen[pk]) continue;
      seen[pk]=1; pairs.push(a,c);
    }
  }
}

function solveContacts(){
  buildPairs();
  for(var p=0;p<pairs.length;p+=2){
    var A=bears[pairs[p]], B=bears[pairs[p+1]];
    var dx=B.ccx-A.ccx, dy=B.ccy-A.ccy;
    if(Math.sqrt(dx*dx+dy*dy) > (A.rad+B.rad)*0.99) continue;
    if(TUNE.separate) separate(A,B);   /* whole-body: bodies never occupy each other */
    pushOut(A,B); pushOut(B,A);        /* surface: outline vs outline */
  }
}

/* three fat circles per bear, resolved as a summed positional correction */
function separate(A,B){
  var i, j, sx=0, sy=0, tq=0;
  for(i=0;i<A.proxies.length;i++) for(j=0;j<B.proxies.length;j++){
    var pa=A.proxies[i], pb=B.proxies[j];
    var dx=pb.x-pa.x, dy=pb.y-pa.y, rs=pa.r+pb.r, d2=dx*dx+dy*dy;
    if(d2>=rs*rs) continue;
    var d=Math.sqrt(d2);
    var pen=(rs-(d<1e-4?1e-4:d))/(d<1e-4?1e-4:d);
    sx+=dx*pen; sy+=dy*pen;
    tq+=((pa.x+pb.x)*0.5-B.ccx)*dy-((pa.y+pb.y)*0.5-B.ccy)*dx;
  }
  if(sx===0 && sy===0){
    /* only the degenerate case: two bodies on the same spot need a nudge */
    var hx=B.ccx-A.ccx, hy=B.ccy-A.ccy, hd=Math.hypot(hx,hy);
    if(hd > A.rad*0.12) return;
    var ang = ((A.id*7 + B.id*13)%64) * (TAU/64);
    sx = Math.cos(ang); sy = Math.sin(ang);
  }
  var m=Math.hypot(sx,sy);
  if(m<1e-6) return;
  /* one share of the overlap is undone positionally, the rest becomes an
     equal-and-opposite impulse — momentum is conserved, so the pile can
     never pump itself into a boil by teleporting bears upward */
  var maxd=bearSize()*0.024, k=maxd/m;
  if(k<1){ sx*=k; sy*=k; }
  var px=sx*0.30, py=sy*0.30, ivx=sx*0.10, ivy=sy*0.10, i2;
  A.translate(-px, -py);  B.translate( px,  py);
  for(i2=0;i2<A.n;i2++){ A.px[i2]+=ivx; A.py[i2]+=ivy; }
  for(i2=0;i2<B.n;i2++){ B.px[i2]-=ivx; B.py[i2]-=ivy; }
  B.rotateBy(clamp(tq/(B.size*B.size*B.n)*0.0004, -0.012, 0.012));
}

/* particle of A against the real outline of B: a particle that has
   crossed inside is walked back out to the nearest surface point.
   Overlap is resolved positionally; leftover velocity is a damped
   restitution plus tangential friction — never a free energy pump. */
var REST = 0.14, FRIC = 0.30;
function pushOut(A,B){
  var n=A.n, m=B.n, i, j;
  var bx=B.x, by=B.y;
  var lim=B.rad*1.06, lim2=lim*lim;
  var bcx=0, bcy=0;
  for(i=0;i<n;i++){ bcx += B.x[i]-B.px[i]; bcy += B.y[i]-B.py[i]; }
  bcx/=n; bcy/=n;
  var sx=0, sy=0, tq=0, cnt=0;
  for(i=0;i<n;i++){
    var ax=A.x[i], ay=A.y[i];
    var cdx=ax-B.ccx, cdy=ay-B.ccy;
    if(cdx*cdx+cdy*cdy > lim2) continue;
    var inside=false, bd=1e18, bpx=0, bpy=0;
    for(j=0;j<m;j++){
      var j2=(j+1)%m;
      var x1=bx[j], y1=by[j], x2=bx[j2], y2=by[j2];
      if((y1>ay) !== (y2>ay)){
        var tc=(ay-y1)/(y2-y1);
        if(ax < x1 + tc*(x2-x1)) inside=!inside;
      }
      var ex=x2-x1, ey=y2-y1, L2=ex*ex+ey*ey;
      var tp=((ax-x1)*ex+(ay-y1)*ey)/(L2>1e-9?L2:1e-9);
      tp = tp<0?0:(tp>1?1:tp);
      var qx=x1+tp*ex, qy=y1+tp*ey;
      var ddx=ax-qx, ddy=ay-qy, d2=ddx*ddx+ddy*ddy;
      if(d2<bd){ bd=d2; bpx=qx; bpy=qy; }
    }
    if(!inside) continue;
    var d=Math.sqrt(bd); if(d<1e-5) d=1e-5;
    var nx=(bpx-ax)/d, ny=(bpy-ay)/d;                     /* points outward */
    var pen=d*0.95, tx=-ny, ty=nx;
    var vx=ax-A.px[i], vy=ay-A.py[i];
    A.x[i]=ax+nx*pen; A.y[i]=ay+ny*pen;
    var vn=vx*nx+vy*ny, vt=vx*tx+vy*ty;
    if(vn<0) vn = -vn*REST;
    vt = lerp(vt, bcx*tx + bcy*ty, TUNE.friction?FRIC:0);
    A.px[i]=A.x[i]-(vn*nx+vt*tx);
    A.py[i]=A.y[i]-(vn*ny+vt*ty);
    sx+=nx*pen; sy+=ny*pen;
    tq += ((bpx-B.ccx)*ny - (bpy-B.ccy)*nx) * pen;
    cnt++;
  }
  if(!cnt) return;
  var d=Math.hypot(sx,sy)/n, maxd=B.size*0.045;
  if(d>maxd){ sx*=maxd/d; sy*=maxd/d; }
  B.translate(-sx/n*0.6, -sy/n*0.6);
  var ivx=-sx/n*0.045, ivy=-sy/n*0.045, i2;
  for(i2=0;i2<n;i2++){ B.px[i2]+=ivx; B.py[i2]+=ivy; }
  B.rotateBy(clamp(-tq/(B.size*B.size*n)*0.05, -0.02, 0.02));
}

function solveBounds(b){
  var n=b.n, fy=floorY(), i, grounded=false;
  var wallL=b.size*0.12, wallR=W-b.size*0.12, ceil=H*0.015;
  for(i=0;i<n;i++){
    if(b.y[i] > fy){
      grounded=true;
      var vy=b.y[i]-b.py[i], vx=b.x[i]-b.px[i];
      b.y[i]=fy;
      b.px[i]=b.x[i]-vx*0.55;                            // floor friction
      b.py[i]= (vy > b.size*0.085) ? b.y[i]+vy*0.30 : b.y[i];   // jelly bounce
    }
    if(b.x[i] < wallL){
      var vxl=b.x[i]-b.px[i], vyl=b.y[i]-b.py[i];
      b.x[i]=wallL; b.px[i]=b.x[i]-vxl*0.35; b.py[i]=b.y[i]-vyl*0.82;
    } else if(b.x[i] > wallR){
      var vxr=b.x[i]-b.px[i], vyr=b.y[i]-b.py[i];
      b.x[i]=wallR; b.px[i]=b.x[i]-vxr*0.35; b.py[i]=b.y[i]-vyr*0.82;
    }
    if(b.y[i] < ceil){
      var vyp=b.y[i]-b.py[i];
      b.y[i]=ceil; b.py[i]=b.y[i]-vyp*0.45;
    }
  }
  b.grounded = grounded;
}

/* ============================================================
   4. Pointer interaction — mouse, touch and pen, up to 4 at once
   ============================================================ */
var pointers = [];

function findBear(x,y){
  var i,j;
  for(i=bears.length-1;i>=0;i--){
    var b=bears[i];
    var dx=x-b.ccx, dy=y-b.ccy;
    if(dx*dx+dy*dy > (b.rad*1.3)*(b.rad*1.3)) continue;
    if(pointInBear(b,x,y)) return b;
  }
  var best=null, bd=1e9;
  for(i=0;i<bears.length;i++){
    var bb=bears[i];
    for(j=0;j<bb.proxies.length;j++){
      var pr=bb.proxies[j];
      var d=Math.hypot(x-pr.x,y-pr.y)-pr.r;
      if(d<bb.size*0.10 && d<bd){ bd=d; best=bb; }
    }
  }
  return best;
}
function pointInBear(b,x,y){
  var n=b.n, inside=false;
  for(var i=0,j=n-1;i<n;j=i++){
    var xi=b.x[i], yi=b.y[i], xj=b.x[j], yj=b.y[j];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi+1e-9)+xi)) inside=!inside;
  }
  return inside;
}

function startGrab(pt){
  var b = findBear(pt.x, pt.y);
  if(!b) return;
  var rad=b.size*0.42, idx=[], w=[], off=[];
  for(var i=0;i<b.n;i++){
    var d=Math.hypot(b.x[i]-pt.x, b.y[i]-pt.y);
    if(d<rad){
      idx.push(i);
      var ww=1-(d/rad)*(d/rad);
      w.push(clamp(0.24+ww,0.24,1));
      off.push(b.x[i]-pt.x, b.y[i]-pt.y);
    }
  }
  if(!idx.length){ idx.push(0); w.push(1); off.push(0,0); }
  b.grab = { idx:idx, w:w, off:off,
             minX:-b.size*0.6, maxX:W+b.size*0.6, minY:-b.size*1.4, maxY:floorY() };
  b.held = 1;
  pt.bear = b;
  Sound.unlock();
  Sound.pop(clamp(Math.hypot(pt.vx,pt.vy)/900,0,1));
}

function releaseGrab(pt){
  var b=pt.bear;
  pt.bear=null;
  if(!b||!b.grab) return;
  var vx=clamp(pt.vx,-1700,1700), vy=clamp(pt.vy,-1700,1700);
  var i,j,f;
  for(i=0;i<b.n;i++){
    f=0.30;
    for(j=0;j<b.grab.idx.length;j++) if(b.grab.idx[j]===i) f=0.55*b.grab.w[j]+0.22;
    b.px[i]=b.x[i]-vx*SUBSTEP*f;
    b.py[i]=b.y[i]-vy*SUBSTEP*f;
  }
  Sound.boing(clamp(Math.hypot(vx,vy)/1500,0,1));
  b.held=0; b.grab=null;
}

function ptrById(id){
  for(var i=0;i<pointers.length;i++) if(pointers[i].id===id) return pointers[i];
  return null;
}
function localXY(e){
  var r=canvas.getBoundingClientRect();
  return { x:e.clientX-r.left, y:e.clientY-r.top };
}
function onDown(e){
  if(e.pointerType==="mouse" && e.button!==undefined && e.button!==0) return;
  var p=localXY(e), pt=ptrById(e.pointerId);
  if(!pt){ pt={id:e.pointerId,x:p.x,y:p.y,vx:0,vy:0,bear:null}; pointers.push(pt); }
  pt.x=p.x; pt.y=p.y; pt.vx=0; pt.vy=0;
  while(pointers.length>4) pointers.shift();
  try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  startGrab(pt);
  canvas.classList.add("dragging");
  canvas.classList.remove("over-bear");
  if(e.cancelable && e.pointerType!=="mouse") e.preventDefault();
}
function onMove(e){
  var p=localXY(e), pt=ptrById(e.pointerId);
  if(!pt){
    canvas.classList.toggle("over-bear", !!findBear(p.x,p.y));
    return;
  }
  var nx=lerp(pt.x,p.x,0.8), ny=lerp(pt.y,p.y,0.8);
  pt.vx = (nx-pt.x)/0.0166;
  pt.vy = (ny-pt.y)/0.0166;
  pt.x=nx; pt.y=ny;
  if(e.cancelable && e.pointerType!=="mouse") e.preventDefault();
}
function onUp(e){
  var pt=ptrById(e.pointerId);
  if(!pt) return;
  releaseGrab(pt);
  var k=pointers.indexOf(pt); if(k>=0) pointers.splice(k,1);
  try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
  if(!pointers.length) canvas.classList.remove("dragging");
}

canvas.addEventListener("pointerdown", onDown, {passive:false});
canvas.addEventListener("pointermove", onMove, {passive:false});
canvas.addEventListener("pointerup", onUp);
canvas.addEventListener("pointercancel", onUp);
canvas.addEventListener("pointerleave", function(){ canvas.classList.remove("over-bear"); });
canvas.addEventListener("contextmenu", function(e){ e.preventDefault(); });
window.addEventListener("touchmove", function(e){ if(e.cancelable) e.preventDefault(); }, {passive:false});

/* ============================================================
   5. Sound — synthesised in code, no samples
   ============================================================ */
var Sound = {
  ac:null, master:null, on:true, lastTap:0,
  unlock:function(){
    if(this.ac || !this.on) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    try{
      this.ac = new AC();
      this.master = this.ac.createGain();
      this.master.gain.value = 0.5;
      this.master.connect(this.ac.destination);
    }catch(err){ this.ac=null; }
  },
  ok:function(){
    if(!this.on) return false;
    this.unlock();
    if(!this.ac) return false;
    if(this.ac.state==="suspended"){ try{ this.ac.resume(); }catch(e){} }
    var t=this.ac.currentTime;
    if(t-this.lastTap < 0.035) return false;
    this.lastTap=t;
    return true;
  },
  thump:function(v){
    if(!this.ok() || v<=0.02) return;
    var ac=this.ac, t=ac.currentTime, dur=0.16;
    var len=Math.max(1,Math.floor(ac.sampleRate*dur));
    var buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0), i;
    for(i=0;i<len;i++){ var e=1-i/len; d[i]=(Math.random()*2-1)*e*e*e; }
    var src=ac.createBufferSource(); src.buffer=buf;
    var lp=ac.createBiquadFilter(); lp.type="lowpass";
    lp.frequency.value=320+900*v; lp.Q.value=1.2;
    var g=ac.createGain(); g.gain.value=0.05+0.20*v;
    src.connect(lp); lp.connect(g); g.connect(this.master);
    src.start(t);
    this.tone(t, 95+120*v, 150+170*v, 0.13, 0.09+0.16*v, "sine");
  },
  pop:function(v){
    if(!this.ok()) return;
    this.tone(this.ac.currentTime, 500+240*v, 250, 0.075, 0.045+0.05*v, "triangle");
  },
  boing:function(v){
    if(!this.ok() || v<0.07) return;
    this.tone(this.ac.currentTime, 175+210*v, 520+420*v, 0.17, 0.05+0.09*v, "sine");
  },
  tone:function(t,f0,f1,dur,gain,type){
    var ac=this.ac;
    var o=ac.createOscillator(); o.type=type||"sine";
    o.frequency.setValueAtTime(Math.max(24,f0),t);
    o.frequency.exponentialRampToValueAtTime(Math.max(24,f1), t+dur);
    var g=ac.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(gain, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.02);
  }
};

/* ============================================================
   6. Simulation step (fixed timestep, bounded catch-up)
   ============================================================ */
var TUNE = { contacts:true, friction:true, settle:true, separate:true, right:true, shape:true, area:true, radial:true, edges:true, sleep:true, grav:1 };

Bear.prototype.awake = function(){ this.frozen=false; this.still=0; };

function step(dt){
  stepCount++;
  var i, j, b, it;
  for(i=0;i<bears.length;i++){
    b=bears[i];
    b.thPrev=b.theta;
    b.fit();
    var slow = b.grounded && b.speed() < 0.55;
    if(TUNE.sleep){
      if(b.frozen){
        if(!b.grounded || b.held) b.awake();
      } else if(b.grounded && !b.held && b.spd < 0.045){
        if(++b.still > 26) b.frozen = true;
      } else b.still = 0;
    }
    if(!b.frozen) b.integrate(dt, b.held ? 0.9968 : (slow ? 0.955 : (b.grounded ? 0.9885 : 0.9955)), (b.held ? 0.2 : 1)*TUNE.grav);
  }
  for(it=0; it<ITERS; it++){
    /* re-fit every iteration: shape matching and contacts must chase the
       body's *current* centroid, never the one it had before it fell */
    for(i=0;i<bears.length;i++) bears[i].fit();
    if(it<2 && TUNE.contacts) solveContacts();
    for(i=0;i<bears.length;i++){
      b=bears[i];
      if(TUNE.shape) b.solveShape(it===0?0.22:0.11);
      if(TUNE.edges) b.solveEdges(0.42, 0.10);
      if(TUNE.area) b.solveArea(0.30);
      if(TUNE.radial) b.solveRadial(0.6);
      if(b.grab){
        for(var q=0;q<pointers.length;q++) if(pointers[q].bear===b) b.solveGrab(pointers[q]);
      }
    }
    for(i=0;i<bears.length;i++) solveBounds(bears[i]);
  }
  for(i=0;i<bears.length;i++){
    b=bears[i];
    b.fit();
    var slow2 = b.grounded && b.speed() < 0.55;
    if(TUNE.settle) b.settle(dt, b.held ? 0.012 : (slow2 ? 0.30 : 0.055));
    if(TUNE.right && !b.held && b.grounded) b.right(b.frozen?0.05:0.014);
    var vy=0, bot=-1e9;
    for(j=0;j<b.n;j++){ vy+=b.y[j]-b.py[j]; if(b.y[j]>bot) bot=b.y[j]; }
    vy/=b.n;
    var now=performance.now();
    if(b.grounded && !b.wasGrounded && vy>b.size*0.05 && now-b.lastImpact>110){
      b.lastImpact=now;
      Sound.thump(clamp(vy/(b.size*0.20),0,1));
    }
    b.wasGrounded=b.grounded;
  }
}

/* ============================================================
   7. Rendering
   ============================================================ */
function bearPath(b){
  var n=b.n, p=new Path2D();
  var ax=b.x[n-1], ay=b.y[n-1];
  p.moveTo((ax+b.x[0])*0.5,(ay+b.y[0])*0.5);
  for(var i=0;i<n;i++){
    var cx=b.x[i], cy=b.y[i], j=(i+1)%n;
    p.quadraticCurveTo(cx,cy,(cx+b.x[j])*0.5,(cy+b.y[j])*0.5);
  }
  p.closePath();
  return p;
}

function drawShadows(){
  var s=BUF, i, j;
  shx.setTransform(s,0,0,s,0,0); shx.clearRect(0,0,W,H);
  cax.setTransform(s,0,0,s,0,0); cax.clearRect(0,0,W,H);
  var fy=floorY();
  for(i=0;i<bears.length;i++){
    var b=bears[i], bot=-1e9;
    for(j=0;j<b.n;j++) if(b.y[j]>bot) bot=b.y[j];
    var gap=clamp((fy-bot)/(b.size*0.85),0,1);
    var cx=b.ccx + b.size*0.10*(1-gap*0.5);

    /* contact shadow */
    var rw=b.size*(0.46+gap*0.42), rh=Math.max(2, b.size*(0.11+gap*0.10));
    var a=0.46*(1-gap*0.82);
    if(a>0.012){
      var g=shx.createRadialGradient(cx,fy,0,cx,fy,rw);
      g.addColorStop(0,"rgba(4,7,12,"+a.toFixed(3)+")");
      g.addColorStop(0.55,"rgba(4,7,12,"+(a*0.55).toFixed(3)+")");
      g.addColorStop(1,"rgba(4,7,12,0)");
      shx.save(); shx.translate(cx,fy); shx.scale(1,rh/rw); shx.translate(-cx,-fy);
      shx.fillStyle=g; shx.beginPath(); shx.arc(cx,fy,rw,0,TAU); shx.fill();
      shx.restore();
    }

    /* caustic: light focused through the candy onto the counter */
    if(gap<0.92){
      var ca=(1-gap)*(1-gap)*0.38, ox=b.size*0.30;
      cax.save();
      cax.globalCompositeOperation="lighter";
      cax.translate(cx+ox, fy);
      cax.scale(1, 0.22);
      cax.translate(-(b.ccx+ox), -bot);
      var cg=cax.createRadialGradient(b.ccx+ox,bot-b.size*0.35,0, b.ccx+ox,bot-b.size*0.35,b.size*0.62);
      cg.addColorStop(0, rgba(b.pal.glow, ca*0.85));
      cg.addColorStop(0.5, rgba(b.pal.mid, ca*0.42));
      cg.addColorStop(1, rgba(b.pal.deep, 0));
      cax.fillStyle=cg;
      cax.fill(bearPath(b));
      cax.restore();
    }
  }
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation="source-over";
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(shBuf,0,0,canvas.width,canvas.height);
  ctx.globalCompositeOperation="lighter";
  ctx.drawImage(caBuf,0,0,canvas.width,canvas.height);
  ctx.globalCompositeOperation="source-over";
}

function drawBear(b){
  var s=b.size, cx=b.ccx, cy=b.ccy, pal=b.pal, i, k;
  var path=bearPath(b);
  var lx=cx+LIGHT.x*s*0.5, ly=cy+LIGHT.y*s*0.5;

  /* 1. translucent body */
  var g0=ctx.createLinearGradient(cx-LIGHT.x*s*0.6, cy-LIGHT.y*s*0.6,
                                  cx+LIGHT.x*s*0.6, cy+LIGHT.y*s*0.6);
  g0.addColorStop(0, rgba(mix(pal.deep,pal.mid,0.35), 0.93));
  g0.addColorStop(0.42, rgba(pal.mid, 0.87));
  g0.addColorStop(1, rgba(mix(pal.mid,pal.hi,0.30), 0.80));
  ctx.globalAlpha=0.90;
  ctx.fillStyle=g0; ctx.fill(path);
  ctx.globalAlpha=1;

  ctx.save();
  ctx.clip(path);

  /* 2. thickness: darker toward the edges */
  var g1=ctx.createRadialGradient(cx-LIGHT.x*s*0.18, cy-LIGHT.y*s*0.18, s*0.16, cx, cy, s*0.62);
  g1.addColorStop(0,"rgba(0,0,0,0)");
  g1.addColorStop(0.62,"rgba(0,0,0,0)");
  g1.addColorStop(1, rgba(pal.deep, 0.60));
  ctx.fillStyle=g1; ctx.fillRect(cx-s,cy-s,s*2,s*2);

  if(quality>=1){
    /* 3. subsurface glow toward the light */
    ctx.globalCompositeOperation="lighter";
    var g2=ctx.createRadialGradient(lx,ly,0,lx,ly,s*0.56);
    g2.addColorStop(0, rgba(mix(pal.hi,[255,255,255],0.25), 0.40));
    g2.addColorStop(0.45, rgba(pal.glow, 0.20));
    g2.addColorStop(1, rgba(pal.glow,0));
    ctx.fillStyle=g2; ctx.fillRect(cx-s,cy-s,s*2,s*2);

    /* 4. bounce back up from the sugary counter */
    var gp=ctx.createRadialGradient(cx, cy+s*0.44, 0, cx, cy+s*0.44, s*0.5);
    gp.addColorStop(0, rgba(pal.glow, 0.26));
    gp.addColorStop(1, rgba(pal.glow,0));
    ctx.fillStyle=gp; ctx.fillRect(cx-s,cy-s,s*2,s*2);
    ctx.globalCompositeOperation="source-over";
  }

  /* 5. muzzle sheen + eyes carried by the deformation */
  var mz=b.mapPoint("muzzle"), eL=b.mapPoint("eyeL"), eR=b.mapPoint("eyeR");
  ctx.globalCompositeOperation="lighter";
  var gm=ctx.createRadialGradient(mz.x,mz.y,0,mz.x,mz.y,s*0.17);
  gm.addColorStop(0, rgba(pal.hi, 0.26));
  gm.addColorStop(1, rgba(pal.hi,0));
  ctx.fillStyle=gm;
  ctx.beginPath(); ctx.arc(mz.x,mz.y,s*0.17,0,TAU); ctx.fill();
  ctx.globalCompositeOperation="source-over";
  var er=Math.max(1.1, s*0.030);
  ctx.fillStyle=rgba(mix(pal.deep,[0,0,0],0.45), 0.52);
  ctx.beginPath(); ctx.arc(eL.x,eL.y,er,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(eR.x,eR.y,er,0,TAU); ctx.fill();
  ctx.globalCompositeOperation="lighter";
  ctx.fillStyle="rgba(255,255,255,0.55)";
  ctx.beginPath(); ctx.arc(eL.x-er*0.32,eL.y-er*0.34,er*0.38,0,TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(eR.x-er*0.32,eR.y-er*0.34,er*0.38,0,TAU); ctx.fill();

  /* 6. wet specular highlights */
  var specs = quality>=2 ? [["specHead",0.115,0.55],["specArm",0.075,0.34],["specHip",0.062,0.24]]
            : quality>=1 ? [["specHead",0.115,0.55]] : [];
  for(i=0;i<specs.length;i++){
    var f=b.mapPoint(specs[i][0]);
    var rr=s*specs[i][1], inten=specs[i][2];
    ctx.save();
    ctx.translate(f.x,f.y);
    ctx.rotate(b.theta-0.5);
    ctx.scale(1,0.52);
    var gs=ctx.createRadialGradient(0,0,0,0,0,rr);
    gs.addColorStop(0,"rgba(255,255,255,"+(0.92*inten).toFixed(3)+")");
    gs.addColorStop(0.42,"rgba(255,255,255,"+(0.34*inten).toFixed(3)+")");
    gs.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=gs;
    ctx.beginPath(); ctx.arc(0,0,rr,0,TAU); ctx.fill();
    ctx.restore();
  }
  ctx.globalCompositeOperation="source-over";
  ctx.restore();

  /* 7. rim light on the lit side + a whisper of a dark edge */
  var gl=ctx.createLinearGradient(cx-LIGHT.x*s*0.8, cy-LIGHT.y*s*0.8,
                                  cx+LIGHT.x*s*0.8, cy+LIGHT.y*s*0.8);
  gl.addColorStop(0,"rgba(255,255,255,0.55)");
  gl.addColorStop(0.34,"rgba(255,255,255,0.14)");
  gl.addColorStop(0.70,"rgba(255,255,255,0)");
  ctx.globalCompositeOperation="lighter";
  ctx.lineWidth=Math.max(1, s*0.020);
  ctx.strokeStyle=gl; ctx.stroke(path);
  ctx.globalCompositeOperation="source-over";
  ctx.lineWidth=1;
  ctx.strokeStyle=rgba(mix(pal.deep,[0,0,0],0.5), 0.22);
  ctx.stroke(path);

  /* 8. pinch marks where the finger holds on */
  if(b.grab){
    ctx.globalCompositeOperation="lighter";
    for(i=0;i<b.grab.idx.length;i++){
      k=b.grab.idx[i];
      var rr2=s*0.05*b.grab.w[i]*2.2;
      var gg=ctx.createRadialGradient(b.x[k],b.y[k],0,b.x[k],b.y[k],rr2);
      gg.addColorStop(0,"rgba(255,255,255,0.42)");
      gg.addColorStop(1,"rgba(255,255,255,0)");
      ctx.fillStyle=gg;
      ctx.beginPath(); ctx.arc(b.x[k],b.y[k],rr2,0,TAU); ctx.fill();
    }
    ctx.globalCompositeOperation="source-over";
  }
}

function drawTethers(){
  ctx.globalCompositeOperation="lighter";
  for(var q=0;q<pointers.length;q++){
    var pt=pointers[q];
    if(!pt.bear||!pt.bear.grab) continue;
    var b=pt.bear, i, k;
    ctx.strokeStyle="rgba(255,255,255,0.15)";
    ctx.lineWidth=1;
    ctx.beginPath();
    for(i=0;i<b.grab.idx.length;i++){
      if(b.grab.w[i]<0.55) continue;
      k=b.grab.idx[i];
      ctx.moveTo(pt.x,pt.y); ctx.lineTo(b.x[k],b.y[k]);
    }
    ctx.stroke();
    var r=b.size*0.13;
    var g=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,r);
    g.addColorStop(0,"rgba(255,255,255,0.30)");
    g.addColorStop(0.6,"rgba(255,255,255,0.07)");
    g.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,r,0,TAU); ctx.fill();
  }
  ctx.globalCompositeOperation="source-over";
}

var drawOrder=[];
function render(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalCompositeOperation="source-over";
  ctx.drawImage(bg,0,0);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawShadows();
  drawOrder = bears.slice();
  drawOrder.sort(function(a,b){ return a.ccy-b.ccy; });   // nearer (lower) in front
  for(var i=0;i<drawOrder.length;i++) drawBear(drawOrder[i]);
  drawTethers();
}

/* ============================================================
   8. Main loop
   ============================================================ */
var accumulator=0, lastT=0, fpsEMA=16.7, frameNo=0, stepCount=0, paused=false;

function frame(t){
  if(!lastT) lastT=t;
  var dtms=Math.min(120, t-lastT);
  lastT=t;
  fpsEMA = fpsEMA*0.92 + dtms*0.08;
  frameNo++;
  if(frameNo===50 && fpsEMA>26) quality=1;
  if(frameNo===130 && fpsEMA>30) quality=0;

  if(!paused){
    accumulator += dtms/1000;
    var guard=0;
    while(accumulator >= SUBSTEP && guard<4){ step(SUBSTEP); accumulator -= SUBSTEP; guard++; }
    if(accumulator > SUBSTEP) accumulator = 0;              // never spiral
  }
  for(var i=0;i<bears.length;i++) bears[i].fit();
  render();
  requestAnimationFrame(frame);
}

/* ============================================================
   9. UI

var elCount=document.getElementById("count"),
    elReset=document.getElementById("reset"),

/* ---- boot ---- */
SHAPE = buildShape(40);
resize();
makePile(seeds.pile);
syncUI();
requestAnimationFrame(frame);

/* ---- tiny probe used by the automated checks (no visual effect) ---- */
window.__gummy = {
  state:function(){
    var moving=0, i, j, b, sp;
    for(i=0;i<bears.length;i++){
      b=bears[i]; sp=0;
      for(j=0;j<b.n;j++) sp+=Math.hypot(b.x[j]-b.px[j], b.y[j]-b.py[j]);
      if(sp/b.n > 0.35) moving++;
    }
    return {
      bears:bears.length, particles:bears.length*40,
      fps:+(1000/Math.max(1,fpsEMA)).toFixed(1),
      quality:quality, pointers:pointers.length,
      held:pointers.filter(function(p){return !!p.bear;}).length,
      moving:moving,
      bounds:{W:W,H:H,floor:floorY(),dpr:dpr},
      sample:(function(){ var b0=bears[0]; if(!b0) return null;
        return {x:b0.ccx,y:b0.ccy,size:b0.size,theta:b0.theta,pal:b0.pal.name}; })(),
      all:(function(){ return bears.map(function(bb){ return {x:bb.ccx,y:bb.ccy,r:bb.rad}; }); })()
    };
  },
  reset:function(){ makePile(seeds.pile); syncUI(); },
  pause:function(v){ paused=!!v; if(!paused){ lastT=0; accumulator=0; } },
  tune:function(o){ for(var k in o) TUNE[k]=o[k]; },
  arr:function(){ return bears; },
  sim:function(nSteps){
    for(var i=0;i<nSteps;i++) step(SUBSTEP);
    for(var j=0;j<bears.length;j++) bears[j].fit();
    return stepCount;
  },
  trace:function(){
    function my(){ var s=0,c=0,i,j; for(j=0;j<bears.length;j++){for(i=0;i<bears[j].n;i++){s+=bears[j].y[i];c++;}} return s/c; }
    function mx(){ var s=0,c=0,i,j; for(j=0;j<bears.length;j++){for(i=0;i<bears[j].n;i++){s+=bears[j].x[i];c++;}} return s/c; }
    var r=[];
    var dt=SUBSTEP;
    var i,b,it;
    r.push({phase:'start', y:+my().toFixed(4), x:+mx().toFixed(4)});
    for(i=0;i<bears.length;i++){ b=bears[i]; b.thPrev=b.theta; b.fit();
      var slow=b.grounded && b.speed()<0.34;
      b.integrate(dt, b.held?0.9968:(slow?0.962:(b.grounded?0.9885:0.9955)), b.held?0.2:1); }
    r.push({phase:'integrate', y:+my().toFixed(4), x:+mx().toFixed(4)});
    for(it=0; it<ITERS; it++){
      if(it<2) solveContacts();
      for(i=0;i<bears.length;i++){
        b=bears[i];
        b.solveShape(it===0?0.22:0.11); b.solveEdges(0.42,0.10); b.solveArea(0.30); b.solveRadial(0.6);
      }
      for(i=0;i<bears.length;i++) solveBounds(bears[i]);
      r.push({phase:'iter'+it, y:+my().toFixed(4), x:+mx().toFixed(4)});
    }
    for(i=0;i<bears.length;i++){ b=bears[i]; b.fit();
      var slow2=b.grounded && b.speed()<0.34;
      b.settle(dt, b.held?0.012:(slow2?0.22:0.055)); }
    r.push({phase:'settle', y:+my().toFixed(4), x:+mx().toFixed(4)});
    return r;
  },
  overlaps:function(){
    var worst=0, wi=-1, wj=-1, i, j;
    for(i=0;i<bears.length;i++) for(j=i+1;j<bears.length;j++){
      var A=bears[i], B=bears[j];
      var d=Math.hypot(B.ccx-A.ccx, B.ccy-A.ccy), s=(A.size+B.size)*0.5;
      var r=d/s;
      if(r<worst || wi<0){ worst=r; wi=i; wj=j; }
    }
    return wi<0? null : {ratio:+worst.toFixed(3), a:wi, b:wj};
  },
  add:function(){ var ok=addBear(); syncUI(); return ok; },
  pointer:{
    down:function(x,y,id){ onDown({pointerId:id||900,clientX:x,clientY:y,button:0,pointerType:"mouse",cancelable:false,preventDefault:function(){}}); },
    move:function(x,y,id){ onMove({pointerId:id||900,clientX:x,clientY:y,cancelable:false,preventDefault:function(){}}); },
    up:function(id){ onUp({pointerId:id||900}); }
  },
  debug:function(){ return {steps:stepCount, t:performance.now()|0, list:bears.map(function(b){var sp=0;for(var j=0;j<b.n;j++)sp+=Math.hypot(b.x[j]-b.px[j],b.y[j]-b.py[j]);return {y:+b.ccy.toFixed(1),x:+b.ccx.toFixed(1),sp:+(sp/b.n).toFixed(3),held:b.held,gr:b.grounded};})}; },
  debug2:function(){
    return bears.map(function(b){
      var minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9,dmax=0,dmin=1e9,sp=0;
      for(var j=0;j<b.n;j++){
        minx=Math.min(minx,b.x[j]);maxx=Math.max(maxx,b.x[j]);miny=Math.min(miny,b.y[j]);maxy=Math.max(maxy,b.y[j]);
        var dd=Math.hypot(b.x[j]-b.ccx,b.y[j]-b.ccy); dmax=Math.max(dmax,dd); dmin=Math.min(dmin,dd);
        sp+=Math.hypot(b.x[j]-b.px[j],b.y[j]-b.py[j]);
      }
      var A=0; for(var j=0;j<b.n;j++){var k=(j+1)%b.n; A+=b.x[j]*b.y[k]-b.x[k]*b.y[j];}
      return {size:+b.size.toFixed(1), rad:+dmax.toFixed(1), dmin:+dmin.toFixed(1),
        w:+(maxx-minx).toFixed(1), h:+(maxy-miny).toFixed(1),
        area:+Math.abs(A/2).toFixed(0), rest:+b.restArea.toFixed(0),
        x:+b.ccx.toFixed(0), y:+b.ccy.toFixed(0), sp:+(sp/b.n).toFixed(2),
        gr:b.grounded, th:+b.theta.toFixed(2),
        px:b.proxies.map(function(q){return [+q.x.toFixed(0),+q.y.toFixed(0),+q.r.toFixed(0)];})};
    });
  },
  shape:function(){ return SHAPE.pts.map(function(p){ return [p.x,p.y]; }); }
};
})();
</script>
