<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Water Balloons</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #e3f2fd; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui {
    position: absolute;
    top: 24px; left: 24px;
    pointer-events: none;
    user-select: none;
  }
  #ui > * { pointer-events: auto; }
  #reset {
    display: inline-block;
    padding: 14px 28px;
    font-size: 17px;
    font-weight: 700;
    background: #ffffff;
    color: #1f3a5f;
    border: 2px solid rgba(255,255,255,0.9);
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(0,0,0,0.12);
    transition: all 0.15s ease;
    font-family: inherit;
  }
  #reset:hover { background: #f8f9fa; border-color: #ffffff; transform: translateY(-1px); box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
  #reset:active { transform: translateY(1px); box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
  .hint {
    margin-top: 12px;
    color: #1f3a5f;
    opacity: 0.85;
    font-size: 14px;
    line-height: 1.5;
    max-width: 240px;
    text-align: left;
  }
  .hint b { color: #2ecc71; font-weight: 800; }
</style>
</head>
<body>
  <div id="ui">
    <button id="reset">Reset Balloons</button>
    <div class="hint">Grab &amp; throw<br><b>Wobble • Collide • Splash • Pop</b></div>
  </div>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const resetBtn = document.getElementById('reset');

    let width, height;

    // ---- Physics config ----
    const GRAVITY = 0.28;
    const DAMPING = 0.965;
    const SPRING_K = 0.13;
    const CENTER_SPRING_K = 0.18;
    const BOUNCE = 0.5;
    const WATER_LINE = 0.86;
    const POP_VEL = 13;
    const SPLASH_VEL = 6;
    const RING_COUNT = 12;

    // ---- State ----
    let balloons = [];
    let droplets = [];
    let splash = [];

    // Pointer / touch tracking
    let pointer = { x: 0, y: 0, prevX: 0, prevY: 0, down: false, velX: 0, velY: 0 };
    let pointers = {};
    let grabbed = null; // { balloon, particle, offsetX, offsetY }

    // ---- Resize ----
    function resize() {
      width = canvas.width = canvas.clientWidth;
      height = canvas.height = canvas.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // ---- Classes ----

    class Particle {
      constructor(x, y) {
        this.x = x; this.y = y;
        this.vx = 0; this.vy = 0;
        this.fixed = false;
        this.r = 4;
      }
    }

    class Balloon {
      constructor(x, y, radius, color, index) {
        this.index = index;
        this.radius = radius;
        this.color = color;
        this.popped = false;

        // Ring of particles forming the soft body
        this.particles = [];
        for (let i = 0; i < RING_COUNT; i++) {
          const a = (i / RING_COUNT) * Math.PI * 2;
          this.particles.push(new Particle(
            x + Math.cos(a) * radius * 0.82,
            y + Math.sin(a) * radius * 0.82
          ));
        }

        // Core particle (holds the water mass)
        this.center = new Particle(x, y);

        // Springs: ring-to-ring + ring-to-center
        this.springs = [];
        for (let i = 0; i < RING_COUNT; i++) {
          const next = (i + 1) % RING_COUNT;
          const chordLen = 2 * radius * 0.82 * Math.sin(Math.PI / RING_COUNT);
          this.springs.push({
            a: this.particles[i],
            b: this.particles[next],
            restLength: chordLen,
            k: SPRING_K
          });
          this.springs.push({
            a: this.particles[i],
            b: this.center,
            restLength: radius * 0.82,
            k: CENTER_SPRING_K
          });
        }
      }

      getVisualCenter() {
        let sx = 0, sy = 0;
        for (let p of this.particles) { sx += p.x; sy += p.y; }
        return { x: sx / RING_COUNT, y: sy / RING_COUNT };
      }

      applyForces() {
        if (this.popped) return;

        // Spring forces
        for (let s of this.springs) {
          const dx = s.b.x - s.a.x;
          const dy = s.b.y - s.a.y;
          const dist = Math.hypot(dx, dy) || 0.001;
          const f = (dist - s.restLength) * s.k;

          if (!s.a.fixed) {
            s.a.vx += (f * dx / dist) * 0.5;
            s.a.vy += (f * dy / dist) * 0.5;
          }
          if (!s.b.fixed) {
            s.b.vx -= (f * dx / dist) * 0.5;
            s.b.vy -= (f * dy / dist) * 0.5;
          }
        }

        // Gravity on center
        this.center.vy += GRAVITY;

        // Damping
        for (let p of this.particles) {
          p.vx *= DAMPING;
          p.vy *= DAMPING;
        }
        this.center.vx *= DAMPING;
        this.center.vy *= DAMPING;

        // Integrate positions
        for (let p of this.particles) {
          p.x += p.vx;
          p.y += p.vy;
        }
        this.center.x += this.center.vx;
        this.center.y += this.center.vy;
      }

      collideWith(other) {
        if (this.popped || other.popped) return;

        const dx = other.center.x - this.center.x;
        const dy = other.center.y - this.center.y;
        const dist = Math.hypot(dx, dy);
        const minDist = (this.radius + other.radius) * 0.95;

        if (dist > minDist || dist === 0) return;

        // Narrow phase: particle-particle repulsion
        let hit = false;
        for (let pa of this.particles) {
          for (let pb of other.particles) {
            const ddx = pb.x - pa.x;
            const ddy = pb.y - pa.y;
            const ddist = Math.hypot(ddx, ddy);
            const minD = pa.r + pb.r + 2;

            if (ddist < minD) {
              hit = true;
              const overlap = minD - ddist;
              const nx = ddx / ddist;
              const ny = ddy / ddist;
              const force = overlap * 0.6;

              if (!pa.fixed) {
                pa.vx -= nx * force;
                pa.vy -= ny * force;
              }
              if (!pb.fixed) {
                pb.vx += nx * force;
                pb.vy += ny * force;
              }
            }
          }
        }

        if (hit) {
          // Center-to-center repulsion
          const overlap = minDist - dist;
          const nx = dx / dist;
          const ny = dy / dist;
          const force = overlap * 0.4;
          if (!this.center.fixed) {
            this.center.vx -= nx * force;
            this.center.vy -= ny * force;
          }
          if (!other.center.fixed) {
            other.center.vx += nx * force;
            other.center.vy += ny * force;
          }

          // Pop / splash decision based on impact speed
          const rvx = other.center.vx - this.center.vx;
          const rvy = other.center.vy - this.center.vy;
          const relSpeed = Math.hypot(rvx, rvy);

          if (relSpeed > POP_VEL) {
            if (Math.random() < 0.6) this.pop();
            if (Math.random() < 0.6) other.pop();
          } else if (relSpeed > SPLASH_VEL) {
            const cx = (this.center.x + other.center.x) / 2;
            const cy = (this.center.y + other.center.y) / 2;
            createSplash(cx, cy, relSpeed * 0.8);
          }
        }
      }

      collideWithWalls() {
        if (this.popped) return;

        const vc = this.getVisualCenter();

        // Left wall
        if (vc.x < this.radius * 0.8) {
          if (!this.center.fixed) this.center.vx *= -BOUNCE;
          for (let p of this.particles) {
            if (!p.fixed && p.x < this.radius * 0.7) p.vx *= -BOUNCE;
          }
        }
        // Right wall
        if (vc.x > width - this.radius * 0.8) {
          if (!this.center.fixed) this.center.vx *= -BOUNCE;
          for (let p of this.particles) {
            if (!p.fixed && p.x > width - this.radius * 0.7) p.vx *= -BOUNCE;
          }
        }
        // Top wall
        if (vc.y < this.radius * 0.6) {
          if (!this.center.fixed) this.center.vy *= -BOUNCE;
          for (let p of this.particles) {
            if (!p.fixed && p.y < this.radius * 0.5) p.vy *= -BOUNCE;
          }
        }

        // Bottom water surface
        const waterY = height * WATER_LINE;
        if (vc.y > waterY - this.radius * 0.4) {
          const impactVel = Math.abs(this.center.vy);
          if (impactVel > SPLASH_VEL * 0.8) {
            createSplash(vc.x, waterY, impactVel);
            if (!this.center.fixed) {
              this.center.vy *= -BOUNCE * 0.6;
              this.center.vx *= 0.85;
            }
            for (let p of this.particles) {
              if (!p.fixed && p.y > waterY + 5) {
                p.y = waterY + 5;
                p.vy *= -BOUNCE * 0.5;
              }
            }
          } else {
            if (!this.center.fixed) {
              this.center.vy *= -BOUNCE * 0.4;
              this.center.vx *= 0.9;
            }
          }
        }
      }

      pop() {
        if (this.popped) return;
        this.popped = true;

        const vc = this.getVisualCenter();

        // Droplets from the ring particles
        for (let p of this.particles) {
          const dx = p.x - vc.x;
          const dy = p.y - vc.y;
          const angle = Math.atan2(dy, dx);
          const speed = Math.random() * 5 + 3;

          droplets.push({
            x: p.x,
            y: p.y,
            vx: Math.cos(angle) * speed + this.center.vx * 0.3,
            vy: Math.sin(angle) * speed + this.center.vy * 0.3,
            life: 1.0,
            maxLife: Math.random() * 1.2 + 0.6,
            size: Math.random() * 3 + 2,
            color: this.color
          });
        }

        // Extra droplets from the center
        for (let i = 0; i < 6; i++) {
          const angle = (i / 6) * Math.PI * 2;
          const speed = Math.random() * 7 + 4;
          droplets.push({
            x: this.center.x,
            y: this.center.y,
            vx: Math.cos(angle) * speed + this.center.vx * 0.4,
            vy: Math.sin(angle) * speed + this.center.vy * 0.4,
            life: 1.0,
            maxLife: Math.random() * 1.2 + 0.6,
            size: Math.random() * 4 + 3,
            color: this.color
          });
        }
      }

      draw() {
        if (this.popped) return;

        const vc = this.getVisualCenter();

        ctx.save();
        ctx.translate(vc.x, vc.y);

        // Radial gradient fill for watery look
        const grad = ctx.createRadialGradient(
          -this.radius * 0.25, -this.radius * 0.25, this.radius * 0.1,
          0, 0, this.radius * 0.85
        );
        grad.addColorStop(0, 'rgba(255,255,255,0.8)');
        grad.addColorStop(0.25, this.color);
        grad.addColorStop(0.7, this.color);
        grad.addColorStop(1, 'rgba(60,90,140,0.3)');

        // Balloon body through particle ring
        ctx.beginPath();
        ctx.moveTo(this.particles[0].x, this.particles[0].y);
        for (let i = 1; i < RING_COUNT; i++) {
          ctx.lineTo(this.particles[i].x, this.particles[i].y);
        }
        ctx.closePath();
        ctx.fillStyle = grad;
        ctx.fill();

        // Specular highlight
        ctx.beginPath();
        ctx.arc(
          -this.radius * 0.3, -this.radius * 0.3,
          this.radius * 0.5, 0, Math.PI * 2
        );
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fill();

        // Thin outline
        ctx.beginPath();
        ctx.moveTo(this.particles[0].x, this.particles[0].y);
        for (let i = 1; i < RING_COUNT; i++) {
          ctx.lineTo(this.particles[i].x, this.particles[i].y);
        }
        ctx.closePath();
        ctx.strokeStyle = 'rgba(40,60,90,0.15)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.restore();
      }
    }

    // ---- Effects ----

    function createSplash(x, y, intensity) {
      const count = Math.floor(intensity * 2.5) + 2;
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.8;
        const speed = Math.random() * 5 + 2;
        splash.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1,
          life: 1.0,
          maxLife: Math.random() * 0.7 + 0.4,
          size: Math.random() * 2 + 1.5,
          color: '#4facfe'
        });
      }
    }

    // ---- Input ----

    function getCanvasPos(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function findBalloonAt(x, y) {
      for (let b of balloons) {
        if (b.popped) continue;
        const vc = b.getVisualCenter();
        const dist = Math.hypot(x - vc.x, y - vc.y);
        if (dist < b.radius * 1.3) return b;
      }
      return null;
    }

    function findClosestParticle(b, x, y) {
      let closest = null;
      let minDist = Infinity;
      for (let p of b.particles) {
        const d = Math.hypot(x - p.x, y - p.y);
        if (d < minDist) { minDist = d; closest = p; }
      }
      const cd = Math.hypot(x - b.center.x, y - b.center.y);
      if (cd < minDist) { closest = b.center; }
      return closest;
    }

    function startGrab(x, y) {
      const b = findBalloonAt(x, y);
      if (!b) return;
      const p = findClosestParticle(b, x, y);
      grabbed = {
        balloon: b,
        particle: p,
        offsetX: x - p.x,
        offsetY: y - p.y
      };
      p.fixed = true;
    }

    function updateGrab(x, y) {
      if (!grabbed) return;
      const p = grabbed.particle;
      p.x = x - grabbed.offsetX;
      p.y = y - grabbed.offsetY;
    }

    function endGrab() {
      if (!grabbed) return;
      const p = grabbed.particle;
      p.fixed = false;
      // Inherit pointer velocity for a satisfying throw
      p.vx += pointer.velX * 0.4;
      p.vy += pointer.velY * 0.4;
      grabbed = null;
    }

    // Mouse events
    canvas.addEventListener('mousedown', e => {
      const pos = getCanvasPos(e.clientX, e.clientY);
      pointer.x = pos.x; pointer.y = pos.y;
      pointer.prevX = pos.x; pointer.prevY = pos.y;
      pointer.down = true;
      startGrab(pos.x, pos.y);
    });

    canvas.addEventListener('mousemove', e => {
      const pos = getCanvasPos(e.clientX, e.clientY);
      pointer.velX = pos.x - pointer.prevX;
      pointer.velY = pos.y - pointer.prevY;
      pointer.prevX = pointer.x; pointer.prevY = pointer.y;
      pointer.x = pos.x; pointer.y = pos.y;
      updateGrab(pos.x, pos.y);
    });

    canvas.addEventListener('mouseup', () => {
      pointer.down = false;
      endGrab();
    });

    // Touch events
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      for (let t of e.changedTouches) {
        const id = t.identifier;
        const pos = { x: t.clientX - rect.left, y: t.clientY - rect.top };
        pointers[id] = { ...pos, prevX: pos.x, prevY: pos.y, down: true, velX: 0, velY: 0 };
        startGrab(pos.x, pos.y);
      }
    });

    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      for (let t of e.changedTouches) {
        const id = t.identifier;
        if (pointers[id]) {
          pointers[id].velX = t.clientX - rect.left - pointers[id].prevX;
          pointers[id].velY = t.clientY - rect.top - pointers[id].prevY;
          pointers[id].prevX = pointers[id].x;
          pointers[id].prevY = pointers[id].y;
          pointers[id].x = t.clientX - rect.left;
          pointers[id].y = t.clientY - rect.top;
          updateGrab(pointers[id].x, pointers[id].y);
        }
      }
    });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      for (let t of e.changedTouches) {
        const id = t.identifier;
        if (pointers[id]) {
          pointers[id].down = false;
          delete pointers[id];
        }
      }
      endGrab();
    });

    // ---- Reset ----

    resetBtn.addEventListener('click', reset);

    function reset() {
      balloons = [];
      droplets = [];
      splash = [];
      grabbed = null;

      const colors = [
        '#4facfe', '#00f2fe', '#a1c4fd', '#00b4ff', '#1dd1b1',
        '#48d1b0', '#51c6f4', '#6fd2ff', '#8fe2ff', '#c6e2ff'
      ];

      const count = 8;
      for (let i = 0; i < count; i++) {
        const radius = 45 + Math.random() * 35;
        const x = Math.random() * (width - radius * 2) + radius;
        const y = Math.random() * (height * 0.55) + 40;
        const color = colors[i % colors.length];
        balloons.push(new Balloon(x, y, radius, color, i));
      }
    }

    // ---- Main loop ----

    function update() {
      // Physics
      for (let b of balloons) {
        b.applyForces();
        b.collideWithWalls();
      }

      // Balloon-balloon collisions
      for (let i = 0; i < balloons.length; i++) {
        for (let j = i + 1; j < balloons.length; j++) {
          balloons[i].collideWith(balloons[j]);
        }
      }

      // Droplets
      for (let i = droplets.length - 1; i >= 0; i--) {
        let d = droplets[i];
        d.x += d.vx;
        d.y += d.vy;
        d.vy += 0.12;
        d.vx *= 0.94;
        d.vy *= 0.94;
        d.life -= 0.018;
        if (d.life <= 0) droplets.splice(i, 1);
      }

      // Splash particles
      for (let i = splash.length - 1; i >= 0; i--) {
        let s = splash[i];
        s.x += s.vx;
        s.y += s.vy;
        s.vy += 0.08;
        s.vx *= 0.95;
        s.vy *= 0.95;
        s.life -= 0.025;
        if (s.life <= 0) splash.splice(i, 1);
      }
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#e3f2fd';
      ctx.fillRect(0, 0, width, height);

      // Water surface line
      const waterY = height * WATER_LINE;
      ctx.beginPath();
      ctx.moveTo(0, waterY);
      ctx.lineTo(width, waterY);
      ctx.strokeStyle = 'rgba(74, 144, 226, 0.25)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Water gradient below the line
      const waterGrad = ctx.createLinearGradient(0, waterY, 0, height);
      waterGrad.addColorStop(0, 'rgba(74, 144, 226, 0.15)');
      waterGrad.addColorStop(1, 'rgba(74, 144, 226, 0)');
      ctx.fillStyle = waterGrad;
      ctx.fillRect(0, waterY, width, height - waterY);

      // Droplets (from pops)
      for (let d of droplets) {
        ctx.globalAlpha = d.life;
        ctx.fillStyle = d.color;
        ctx.beginPath();
        ctx.arc(d.x, d.y, d.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;

      // Splash particles (from impacts)
      for (let s of splash) {
        ctx.globalAlpha = s.life;
        ctx.fillStyle = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;

      // Balloons
      for (let b of balloons) {
        b.draw();
      }

      // Grab indicator
      if (grabbed) {
        const p = grabbed.particle;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.fill();
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Start
    reset();
    loop();
  </script>
</body>
</html>
