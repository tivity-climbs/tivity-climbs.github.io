<html lang="en">

<title>Gummy bears — a little soft-body playground</title>
<style>

.subtitle{font-size:15px;margin:0;letter-spacing:.01em;color:var(--muted)}

<body>
<main>
<header>
 <div><h1>gummy bears<span>.</span></h1><p class="subtitle">A little soft-body playground.</p></div>
 <div class="tools"><p class="invitation"><strong>Grab. Stretch. Squish.</strong><br>Let go for a little chaos.</p><button id="reset" type="button" aria-label="Reset gummy bear pile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1.7 7M4 4v6h6"/></svg>Reset pile</button></div>
</header>
<section class="playground" aria-label="Interactive gummy bear playground">
 <canvas id="c" tabindex="0" aria-label="Soft gummy bears. Drag a bear to stretch it, push it against the floor to squash it, and release to fling. Multiple fingers can pull different parts. With keyboard, use arrow keys to toss a bear, Space to choose another, and R to reset."></canvas>
 <div class="hint" id="hint"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 13-2-8c-.7-2 2-2.6 2.5-.7l1.6 6.1.1-7c0-2 2.7-2 2.7 0l.2 7 .9-5c.4-1.8 2.8-1.3 2.5.5l-.5 6 1.3-2c1-1.3 3 .1 2 1.7l-3.4 7.2c-1.5 3.4-7.3 3.4-9.4.5l-3.6-5c-1.2-1.6.9-3 2-1.7L9 15"/></svg>Pull an ear. Squish a belly. Make a mess.</div>
</section>
<footer><div class="status"><span class="dot"></span><span id="status" aria-live="polite">Soft, squishy &amp; a little unpredictable.</span><span class="kbd-note">Mouse or touch</span></div><p class="footer-note">All the fun. None of the sticky fingers.</p></footer>
</main>
<script>
'use strict';
(() => {
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d',{alpha:true});
const status=document.getElementById('status'), hint=document.getElementById('hint');
let gel=null;
let W=0,H=0,DPR=1,S=75,bears=[],grabs=new Map(),accumulator=0,last=0,seed=47,selected=0,interacted=false;
const STEP=1/120, ITERATIONS=5, GRAVITY=1280;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};
// Each anatomical mass has a radius, and a flexible network of rest-length links.
const anatomy=[
 [0,-.53,.405],[-.37,-.88,.195],[.37,-.88,.195],
 [0,-.03,.335],[0,.36,.39],[-.52,.025,.205],[.52,.025,.205],
 [-.24,.61,.245],[.24,.61,.245],[-.32,.82,.245],[.32,.82,.245]
];
const flavors=[{name:'raspberry',h:345,s:90,l:52},{name:'tangerine',h:23,s:99,l:50},{name:'lemon',h:47,s:99,l:49},{name:'apple',h:151,s:77,l:40},{name:'blackcurrant',h:271,s:69,l:60},{name:'blue raspberry',h:191,s:91,l:44}];
const col=(f,l,a=1)=>`hsla(${f.h},${f.s}%,${l}%,${a})`;
// A sculpted candy silhouette. All control points are attached to the soft body;
// even the eyes, embossed paws and specular highlights follow the deformation.
const outline=[['M',0,-.88],['C',.07,-.88,.13,-.86,.17,-.84],['C',.13,-1.02,.28,-1.12,.41,-1.075],['C',.59,-1.04,.64,-.86,.55,-.75],['C',.53,-.72,.50,-.71,.48,-.70],['C',.60,-.50,.56,-.31,.41,-.21],['C',.58,-.27,.77,-.14,.755,.045],['C',.75,.22,.60,.30,.48,.235],['C',.46,.39,.43,.53,.47,.62],['C',.65,.72,.65,.96,.46,1.035],['C',.29,1.10,.12,1.04,.085,.89],['Q',0,.84,-.085,.89],['C',-.12,1.04,-.29,1.10,-.46,1.035],['C',-.65,.96,-.65,.72,-.47,.62],['C',-.43,.53,-.46,.39,-.48,.235],['C',-.60,.30,-.75,.22,-.755,.045],['C',-.77,-.14,-.58,-.27,-.41,-.21],['C',-.56,-.31,-.60,-.50,-.48,-.70],['C',-.50,-.71,-.53,-.72,-.55,-.75],['C',-.64,-.86,-.59,-1.04,-.41,-1.075],['C',-.28,-1.12,-.13,-1.02,-.17,-.84],['C',-.13,-.86,-.07,-.88,0,-.88],['Z']];
const weightCache=new Map();
function weights(x,y){const key=x+','+y;let a=weightCache.get(key);if(a)return a;let sum=0;a=anatomy.map((n,i)=>{const d=(x-n[0])**2+(y-n[1])**2;return {i,w:1/(d+.045)**2.3}}).sort((a,b)=>b.w-a.w).slice(0,4);for(const v of a)sum+=v.w;for(const v of a)v.w/=sum;weightCache.set(key,a);return a}

function makeBear(x,y,angle,flavor,id){const co=Math.cos(angle),si=Math.sin(angle);const b={id,flavor,nodes:[],links:[],path:null,angle,cx:x,cy:y};
 anatomy.forEach(([rx,ry,r],i)=>{const px=x+(rx*co-ry*si)*S,py=y+(rx*si+ry*co)*S;b.nodes.push({x:px,y:py,px,py,vx:0,vy:0,r:r*S,inv:1/Math.max(.5,r*r*10),co,si,i,b})});
 for(let i=0;i<anatomy.length;i++)for(let j=i+1;j<anatomy.length;j++){const a=anatomy[i],c=anatomy[j],d=Math.hypot(a[0]-c[0],a[1]-c[1]);if(d<1.02)b.links.push({a:i,b:j,rest:d*S,k:d<.65?.10:.035})}
 return b;
}
function fit(b){let cx=0,cy=0,qx=0,qy=0;for(let i=0;i<11;i++){cx+=b.nodes[i].x;cy+=b.nodes[i].y;qx+=anatomy[i][0];qy+=anatomy[i][1]}cx/=11;cy/=11;qx/=11;qy/=11;let a=0,d=0;for(let i=0;i<11;i++){const x=anatomy[i][0]-qx,y=anatomy[i][1]-qy,px=b.nodes[i].x-cx,py=b.nodes[i].y-cy;a+=x*px+y*py;d+=x*py-y*px}const angle=Math.atan2(d,a);b.cx=cx;b.cy=cy;b.angle=angle;return {cx,cy,qx,qy,co:Math.cos(angle),si:Math.sin(angle)}}
function rotations(b){fit(b);for(let i=0;i<11;i++){let a=0,d=0;const n=b.nodes[i],q=anatomy[i];for(const l of b.links){if(l.a!==i&&l.b!==i)continue;const j=l.a===i?l.b:l.a,r=anatomy[j],m=b.nodes[j],x=r[0]-q[0],y=r[1]-q[1],px=m.x-n.x,py=m.y-n.y,w=1/(x*x+y*y+.1);a+=w*(x*px+y*py);d+=w*(x*py-y*px)}const angle=Math.atan2(d,a);n.co=Math.cos(angle);n.si=Math.sin(angle)}}
function shape(b,amount){const f=fit(b);for(let i=0;i<11;i++){const n=b.nodes[i],q=anatomy[i],x=(q[0]-f.qx)*S,y=(q[1]-f.qy)*S;n.x+=(f.cx+f.co*x-f.si*y-n.x)*amount;n.y+=(f.cy+f.si*x+f.co*y-n.y)*amount}}
function bounds(n){const pad=9, floor=H-15;n.x=Math.max(n.r+pad,Math.min(W-n.r-pad,n.x));n.y=Math.max(n.r+5,Math.min(floor-n.r,n.y))}
// Broad phase: a spatial hash bounds the contact work even while the pile scatters.
function contacts(){const cell=S*.9,grid=new Map();for(const b of bears)for(const n of b.nodes){const ix=Math.floor(n.x/cell),iy=Math.floor(n.y/cell);for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++){const bucket=grid.get((ix+dx)+','+(iy+dy));if(!bucket)continue;for(const m of bucket){if(m.b===b)continue;let x=n.x-m.x,y=n.y-m.y,rr=n.r+m.r,d2=x*x+y*y;if(d2>=rr*rr)continue;const d=Math.sqrt(d2)||.001,depth=(rr-d)*.83,xn=x/d,yn=y/d,inv=1/(n.inv+m.inv);n.x+=xn*depth*n.inv*inv;n.y+=yn*depth*n.inv*inv;m.x-=xn*depth*m.inv*inv;m.y-=yn*depth*m.inv*inv;
 // Position-level friction stops an otherwise frictionless pile melting sideways.
 const tx=-yn,ty=xn,slide=((n.x-n.px)-(m.x-m.px))*tx+((n.y-n.py)-(m.y-m.py))*ty,f=Math.max(-depth*.3,Math.min(depth*.3,slide*.18));n.x-=tx*f*n.inv*inv;n.y-=ty*f*n.inv*inv;m.x+=tx*f*m.inv*inv;m.y+=ty*f*m.inv*inv;
 }}const key=ix+','+iy;let bucket=grid.get(key);if(!bucket)grid.set(key,bucket=[]);bucket.push(n)}}
function grabConstraint(g){const b=g.b;let ax=0,ay=0,sum=0;for(const t of g.attach){const n=b.nodes[t.i];ax+=(n.x+n.co*t.ox-n.si*t.oy)*t.w;ay+=(n.y+n.si*t.ox+n.co*t.oy)*t.w;sum+=t.w*t.w*n.inv}let dx=(g.x-ax)*.48,dy=(g.y-ay)*.48;const max=S*.28,d=Math.hypot(dx,dy);if(d>max){dx*=max/d;dy*=max/d}for(const t of g.attach){const n=b.nodes[t.i],m=t.w*n.inv/sum;n.x+=dx*m;n.y+=dy*m}g.ax=ax;g.ay=ay}
function step(dt){for(const b of bears)for(const n of b.nodes){n.px=n.x;n.py=n.y;n.vx*=.996;n.vy=n.vy*.996+GRAVITY*dt;n.x+=n.vx*dt;n.y+=n.vy*dt}
 for(let k=0;k<ITERATIONS;k++){
  for(const b of bears){shape(b,.0035);for(const l of b.links){const a=b.nodes[l.a],c=b.nodes[l.b],x=c.x-a.x,y=c.y-a.y,d=Math.hypot(x,y)||.001,t=(d-l.rest)/d*l.k/(a.inv+c.inv);a.x+=x*t*a.inv;a.y+=y*t*a.inv;c.x-=x*t*c.inv;c.y-=y*t*c.inv}}
  contacts();for(const g of grabs.values())grabConstraint(g);for(const b of bears)for(const n of b.nodes)bounds(n);
 }
 for(const b of bears){for(const n of b.nodes){n.vx=Math.max(-2300,Math.min(2300,(n.x-n.px)/dt));n.vy=Math.max(-2300,Math.min(2300,(n.y-n.py)/dt));if(n.y>=H-15-n.r-.1){n.vx*=.92;if(n.vy>0)n.vy=0}if(n.x<=n.r+9.1||n.x>=W-n.r-9.1)n.vx*=.7}rotations(b)}
}
// Pre-rendered soft shadow, made from exactly the same vector outline; no assets.
const shadow=document.createElement('canvas');shadow.width=160;shadow.height=216;const sh=shadow.getContext('2d');
sh.translate(80,108);sh.scale(77,77);let shadowPath=new Path2D();for(const c of outline){const v=c.slice(1);if(c[0]==='M')shadowPath.moveTo(...v);else if(c[0]==='C')shadowPath.bezierCurveTo(...v);else if(c[0]==='Q')shadowPath.quadraticCurveTo(...v);else shadowPath.closePath()}sh.fillStyle='#433156';sh.shadowColor='#433156';sh.shadowBlur=9;sh.globalAlpha=.16;sh.fill(shadowPath);
function local(b,x,y,fn){const p=map(b,x,y),u=map(b,x+.025,y),v=map(b,x,y+.025);ctx.save();ctx.transform((u[0]-p[0])/.025,(u[1]-p[1])/.025,(v[0]-p[0])/.025,(v[1]-p[1])/.025,p[0],p[1]);fn();ctx.restore()}
function relief(b,x,y,rx,ry,depth=1){local(b,x,y,()=>{const f=b.flavor;ctx.beginPath();ctx.ellipse(0,0,rx,ry,0,0,Math.PI*2);let g=ctx.createLinearGradient(-rx,-ry,rx,ry);g.addColorStop(0,col(f,97,.38*depth));g.addColorStop(.32,col(f,72,.05));g.addColorStop(.73,col(f,f.l-13,.07*depth));g.addColorStop(1,col(f,24,.26*depth));ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=col(f,98,.22);ctx.lineWidth=.012;ctx.stroke();ctx.beginPath();ctx.ellipse(-rx*.09,-ry*.025,rx*.88,ry*.88,0,Math.PI*1.03,Math.PI*1.62);ctx.strokeStyle='#ffffff66';ctx.lineWidth=.014;ctx.stroke()})}
function shine(b,commands,width,alpha){ctx.strokeStyle=`rgba(255,255,255,${alpha})`;ctx.lineWidth=width*S;ctx.lineCap='round';ctx.stroke(pathFor(b,commands))}
function drawBear(b){const f=b.flavor;const p=b.path=pathFor(b);let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;for(const n of b.nodes){minX=Math.min(minX,n.x-n.r);minY=Math.min(minY,n.y-n.r);maxX=Math.max(maxX,n.x+n.r);maxY=Math.max(maxY,n.y+n.r)}
 ctx.save();ctx.translate(b.cx+3,b.cy+S*.07);ctx.rotate(b.angle);ctx.globalAlpha=.49;ctx.drawImage(shadow,-S*1.04,-S*1.49,S*2.08,S*2.81);ctx.restore();
 let g=ctx.createLinearGradient(minX,minY,maxX,maxY);g.addColorStop(0,col(f,78,.66));g.addColorStop(.18,col(f,61,.71));g.addColorStop(.42,col(f,f.l,.72));g.addColorStop(.72,col(f,f.l-4,.80));g.addColorStop(1,col(f,f.l-16,.86));ctx.fillStyle=g;ctx.fill(p);
 ctx.save();ctx.clip(p);
 // Rounded gel edges and a soft refracted light pool inside the candy.
 const rim=ctx.createLinearGradient(minX,minY,maxX,maxY);rim.addColorStop(0,col(f,97,.61));rim.addColorStop(.25,col(f,80,.10));rim.addColorStop(.70,col(f,24,.16));rim.addColorStop(1,col(f,17,.32));ctx.strokeStyle=rim;ctx.lineWidth=S*.10;ctx.stroke(p);
 let pool=ctx.createRadialGradient(minX+(maxX-minX)*.37,minY+(maxY-minY)*.25,0,minX+(maxX-minX)*.5,minY+(maxY-minY)*.33,S*1.3);pool.addColorStop(0,col(f,95,.26));pool.addColorStop(.55,col(f,80,.02));pool.addColorStop(1,col(f,35,0));ctx.fillStyle=pool;ctx.fill(p);
 relief(b,0,.31,.30,.40,.95);relief(b,-.375,-.88,.112,.12,.8);relief(b,.375,-.88,.112,.12,.8);relief(b,-.565,.04,.105,.16,.85);relief(b,.565,.04,.105,.16,.85);relief(b,-.325,.84,.175,.115,.8);relief(b,.325,.84,.175,.115,.8);relief(b,0,-.39,.23,.155,1.2);
 // Molded eyes, nose and smile use the candy hue, rather than painted-on black.
 for(const x of [-.174,.174])local(b,x,-.605,()=>{ctx.fillStyle=col(f,19,.48);ctx.beginPath();ctx.ellipse(0,0,.042,.049,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff9';ctx.beginPath();ctx.ellipse(-.009,-.015,.014,.011,0,0,Math.PI*2);ctx.fill()});
 local(b,0,-.424,()=>{const g=ctx.createLinearGradient(0,-.04,0,.04);g.addColorStop(0,col(f,24,.58));g.addColorStop(1,col(f,35,.20));ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(0,0,.071,.045,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff7';ctx.beginPath();ctx.ellipse(-.015,-.020,.025,.008,-.1,0,Math.PI*2);ctx.fill()});
 ctx.strokeStyle=col(f,23,.32);ctx.lineWidth=.014*S;ctx.lineCap='round';ctx.stroke(pathFor(b,[['M',0,-.38],['L',0,-.335],['Q',-.045,-.29,-.09,-.33],['M',0,-.335],['Q',.045,-.29,.09,-.33]]));
 // Narrow, bright softbox reflections make the translucent material read as gel.
 shine(b,[['M',-.49,-.86],['C',-.51,-.97,-.38,-1.026,-.30,-.98]],.043,.76);
 shine(b,[['M',.29,-1.0],['Q',.39,-1.04,.46,-.95]],.026,.62);
 shine(b,[['M',-.405,-.65],['Q',-.46,-.51,-.41,-.425]],.048,.61);
 shine(b,[['M',-.28,-.755],['Q',-.15,-.82,-.03,-.80]],.025,.47);
 shine(b,[['M',-.64,-.08],['Q',-.71,.01,-.65,.11]],.037,.73);
 shine(b,[['M',.52,-.12],['Q',.63,-.12,.66,-.035]],.030,.52);
 shine(b,[['M',-.25,.12],['Q',-.30,.27,-.25,.39]],.038,.45);
 shine(b,[['M',-.48,.78],['Q',-.51,.92,-.39,.96]],.035,.69);
 shine(b,[['M',.23,.73],['Q',.34,.69,.43,.77]],.027,.5);
 shine(b,[['M',.38,.38],['Q',.39,.49,.35,.55]],.025,.25);
 ctx.restore();ctx.strokeStyle=col(f,28,.25);ctx.lineWidth=.8;ctx.stroke(p);
}
function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
 // A very subtle tabletop and contact-light ellipse ground the pile.
 const floor=H-14;let g=ctx.createRadialGradient(W*.5,floor,0,W*.5,floor,W*.4);g.addColorStop(0,'rgba(115,81,133,.10)');g.addColorStop(1,'rgba(115,81,133,0)');ctx.save();ctx.translate(0,floor);ctx.scale(1,.055);ctx.translate(0,-floor);ctx.fillStyle=g;ctx.fillRect(0,floor-W*.4,W,W*.8);ctx.restore();
 if(gel)gel.draw();else for(const b of bears)drawBear(b);
